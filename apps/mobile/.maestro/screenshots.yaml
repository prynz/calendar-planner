# Real screenshots of the running preview build (Android emulator / iOS simulator).
# File names: shot-<PLATFORM>-NN-<screen>.png → docs/previews/screenshots/<prefix>-<PLATFORM>-NN-<screen>.png
# The device starts in English + dark mode: the app follows the system until the user picks a language/theme.
# Demo data is generated relative to "today", so the leave-time card appears only when CI runs inside its window.
appId: ${APP_ID}
---
- launchApp:
    clearState: true
- runFlow: dismiss-system-dialogs.yaml
# Phase 6: first start shows the onboarding (age confirmation, Plus trial as Demo).
- extendedWaitUntil:
    visible:
      id: 'screen-onboarding'
    timeout: 90000
- waitForAnimationToEnd
- takeScreenshot: screenshots/shot-${PLATFORM}-34-onboarding
- tapOn:
    id: 'onb-next'
- tapOn:
    id: 'onb-age'
- tapOn:
    id: 'onb-next'
- tapOn:
    id: 'onb-next'
- waitForAnimationToEnd
- takeScreenshot: screenshots/shot-${PLATFORM}-35-onboarding-trial
- tapOn:
    id: 'onb-finish'
- extendedWaitUntil:
    visible:
      id: 'screen-today'
    timeout: 30000
- assertVisible:
    id: 'demo-badge'
- waitForAnimationToEnd
- takeScreenshot: screenshots/shot-${PLATFORM}-01-today-en-dark
# Detail with the backwards leave plan (game night is the last card today – it cannot always be centred)
- scrollUntilVisible:
    element:
      id: 'event-demo-games'
    direction: DOWN
- waitForAnimationToEnd
- tapOn:
    id: 'event-demo-games'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: 'detail-plan'
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: screenshots/shot-${PLATFORM}-02-detail-leave-plan
- waitForAnimationToEnd
- tapOn:
    id: 'detail-back'
    retryTapIfNoChange: true
# Calendar: month, week, list
- tapOn:
    id: 'tab-calendar'
- extendedWaitUntil:
    visible:
      id: 'screen-calendar'
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: screenshots/shot-${PLATFORM}-03-calendar-month
- tapOn:
    id: 'cal-view-week'
- waitForAnimationToEnd
- takeScreenshot: screenshots/shot-${PLATFORM}-04-calendar-week
- tapOn:
    id: 'cal-view-list'
- waitForAnimationToEnd
- takeScreenshot: screenshots/shot-${PLATFORM}-05-calendar-list
# Create a plan with a leave time
- tapOn:
    id: 'fab-add'
- extendedWaitUntil:
    visible:
      id: 'screen-editor'
    timeout: 10000
- tapOn:
    id: 'editor-title'
- inputText: 'Physio'
- hideKeyboard
- scrollUntilVisible:
    element:
      id: 'editor-travel-bike'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'editor-travel-bike'
- tapOn:
    id: 'editor-travel-min-inc'
- waitForAnimationToEnd
- takeScreenshot: screenshots/shot-${PLATFORM}-06-editor-leave-preview
- tapOn:
    id: 'editor-save'
# The editor must close after a successful save (fails here if validation or saving went wrong).
- extendedWaitUntil:
    notVisible:
      id: 'screen-editor'
    timeout: 10000
# Smaller screens (iPhone) show the new plan below the fold.
- scrollUntilVisible:
    element: '.*Physio.*'
    direction: DOWN
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: screenshots/shot-${PLATFORM}-07-list-after-save
# German + light theme + reminder settings
- tapOn:
    id: 'tab-settings'
- extendedWaitUntil:
    visible:
      id: 'screen-settings'
    timeout: 10000
# Phase 6 put the plan card on top: scroll the switches into the middle before tapping, so the tap cannot
# land on another control while the list still settles.
- scrollUntilVisible:
    element:
      id: 'language-de'
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: 'language-de'
- scrollUntilVisible:
    element:
      id: 'theme-light'
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: 'theme-light'
- waitForAnimationToEnd
- takeScreenshot: screenshots/shot-${PLATFORM}-08-settings-de-light
- tapOn:
    id: 'tab-index'
# The Today list is still scrolled down from the detail step at the start.
- scrollUntilVisible:
    element: 'Dein Tag'
    direction: UP
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: screenshots/shot-${PLATFORM}-09-today-de-light
# Persistence: relaunch WITHOUT clearing state → language, theme and the new plan are kept.
- stopApp
- launchApp:
    clearState: false
- runFlow: dismiss-system-dialogs.yaml
- extendedWaitUntil:
    visible: 'Dein Tag'
    timeout: 60000
- scrollUntilVisible:
    element: '.*Physio.*'
    direction: DOWN
- waitForAnimationToEnd
- takeScreenshot: screenshots/shot-${PLATFORM}-10-after-relaunch-plan-kept
# ---------------------------------------------------------------- Phase 3: events & collaboration
# Navigation taps wait for running transitions and retry once nothing changed: a tap during a screen
# transition or right after a fling is otherwise swallowed (seen on both platforms).
- tapOn:
    id: 'tab-events'
- extendedWaitUntil:
    visible:
      id: 'screen-events'
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: screenshots/shot-${PLATFORM}-11-events-invitations
# Answer Tom's invitation, then the bento overview
- scrollUntilVisible:
