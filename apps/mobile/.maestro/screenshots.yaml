# Real screenshots of the running preview build (Android emulator / iOS simulator).
# File names: shot-<PLATFORM>-NN-<screen>.png → docs/previews/screenshots/<prefix>-<PLATFORM>-NN-<screen>.png
# The device starts in English + dark mode: the app follows the system until the user picks a language/theme.
# Demo data is generated relative to "today", so the leave-time card appears only when CI runs inside its window.
appId: ${APP_ID}
---
- launchApp:
    clearState: true
- runFlow: dismiss-system-dialogs.yaml
- extendedWaitUntil:
    visible:
      id: 'screen-today'
    timeout: 90000
- assertVisible:
    id: 'demo-badge'
- waitForAnimationToEnd
- takeScreenshot: screenshots/shot-${PLATFORM}-01-today-en-dark
# Detail with the backwards leave plan
- scrollUntilVisible:
    element:
      id: 'event-demo-games'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'event-demo-games'
- extendedWaitUntil:
    visible:
      id: 'detail-plan'
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: screenshots/shot-${PLATFORM}-02-detail-leave-plan
- tapOn:
    id: 'detail-back'
# Calendar: month, week, list
- tapOn:
    id: 'tab-calendar'
- extendedWaitUntil:
    visible:
      id: 'screen-calendar'
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: screenshots/shot-${PLATFORM}-03-calendar-month
- tapOn:
    id: 'cal-view-week'
- waitForAnimationToEnd
- takeScreenshot: screenshots/shot-${PLATFORM}-04-calendar-week
- tapOn:
    id: 'cal-view-list'
- waitForAnimationToEnd
- takeScreenshot: screenshots/shot-${PLATFORM}-05-calendar-list
# Create a plan with a leave time
- tapOn:
    id: 'fab-add'
- extendedWaitUntil:
    visible:
      id: 'screen-editor'
    timeout: 10000
- tapOn:
    id: 'editor-title'
- inputText: 'Physio'
- hideKeyboard
- scrollUntilVisible:
    element:
      id: 'editor-travel-bike'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'editor-travel-bike'
- tapOn:
    id: 'editor-travel-min-inc'
- waitForAnimationToEnd
- takeScreenshot: screenshots/shot-${PLATFORM}-06-editor-leave-preview
- tapOn:
    id: 'editor-save'
# The editor must close after a successful save (fails here if validation or saving went wrong).
- extendedWaitUntil:
    notVisible:
      id: 'screen-editor'
    timeout: 10000
# Smaller screens (iPhone) show the new plan below the fold.
- scrollUntilVisible:
    element: '.*Physio.*'
    direction: DOWN
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: screenshots/shot-${PLATFORM}-07-list-after-save
# German + light theme + reminder settings
- tapOn:
    id: 'tab-settings'
- extendedWaitUntil:
    visible:
      id: 'screen-settings'
    timeout: 10000
- tapOn:
    id: 'language-de'
- tapOn:
    id: 'theme-light'
- waitForAnimationToEnd
- takeScreenshot: screenshots/shot-${PLATFORM}-08-settings-de-light
- tapOn:
    id: 'tab-index'
# The Today list is still scrolled down from the detail step at the start.
- scrollUntilVisible:
    element: 'Dein Tag'
    direction: UP
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: screenshots/shot-${PLATFORM}-09-today-de-light
# Persistence: relaunch WITHOUT clearing state → language, theme and the new plan are kept.
- stopApp
- launchApp:
    clearState: false
- runFlow: dismiss-system-dialogs.yaml
- extendedWaitUntil:
    visible: 'Dein Tag'
    timeout: 60000
- scrollUntilVisible:
    element: '.*Physio.*'
    direction: DOWN
- waitForAnimationToEnd
- takeScreenshot: screenshots/shot-${PLATFORM}-10-after-relaunch-plan-kept
# ---------------------------------------------------------------- Phase 3: events & collaboration
- tapOn:
    id: 'tab-events'
- extendedWaitUntil:
    visible:
      id: 'screen-events'
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: screenshots/shot-${PLATFORM}-11-events-invitations
# Answer Tom's invitation, then the bento overview
- scrollUntilVisible:
    element:
      id: 'event-demo-tom-party'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'event-demo-tom-party'
- extendedWaitUntil:
    visible:
      id: 'detail-plan'
    timeout: 10000
# The answer card sits below the leave plan.
- scrollUntilVisible:
    element:
      id: 'rsvp-card'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'rsvp-yes'
- scrollUntilVisible:
    element:
      id: 'tile-chat'
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- takeScreenshot: screenshots/shot-${PLATFORM}-12-detail-rsvp-bento
# The detail header scrolls with the content – bring the back button into view first.
- scrollUntilVisible:
    element:
      id: 'detail-back'
    direction: UP
- tapOn:
    id: 'detail-back'
# Swipe poll (buttons are the equal alternative to the gesture)
- scrollUntilVisible:
    element:
      id: 'event-demo-bbq'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'event-demo-bbq'
- scrollUntilVisible:
    element:
      id: 'tile-poll'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'tile-poll'
- extendedWaitUntil:
    visible:
      id: 'poll-deck'
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: screenshots/shot-${PLATFORM}-13-poll-swipe
- tapOn:
    id: 'poll-deck-yes'
- tapOn:
    id: 'poll-deck-if-needed'
- extendedWaitUntil:
    notVisible:
      id: 'poll-deck'
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: screenshots/shot-${PLATFORM}-14-poll-results
- tapOn:
    id: 'collab-back'
# Bring list
- scrollUntilVisible:
    element:
      id: 'tile-bring'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'tile-bring'
- extendedWaitUntil:
    visible:
      id: 'screen-bring'
    timeout: 10000
- tapOn:
    id: 'bring-claim-bbq-b2-inc'
- waitForAnimationToEnd
- takeScreenshot: screenshots/shot-${PLATFORM}-15-bring-list
- tapOn:
    id: 'collab-back'
# Chat: a simulated person answers after a few seconds
- scrollUntilVisible:
    element:
      id: 'tile-chat'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'tile-chat'
- extendedWaitUntil:
    visible:
      id: 'screen-chat'
    timeout: 10000
- tapOn:
    id: 'chat-input'
- inputText: 'Ich bring Brot mit'
- tapOn:
    id: 'chat-send'
- hideKeyboard
- extendedWaitUntil:
    visible: '(Klingt gut|Bin dabei|Super, danke|Passt mir|Haha, perfekt).*'
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: screenshots/shot-${PLATFORM}-16-chat-demo-reply
- tapOn:
    id: 'collab-back'
# The detail header scrolls with the content – bring the back button into view first.
- scrollUntilVisible:
    element:
      id: 'detail-back'
    direction: UP
- tapOn:
    id: 'detail-back'
# Templates → prefilled editor with invitees
- scrollUntilVisible:
    element:
      id: 'events-templates'
    direction: UP
    centerElement: true
- tapOn:
    id: 'events-templates'
- extendedWaitUntil:
    visible:
      id: 'screen-templates'
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: screenshots/shot-${PLATFORM}-17-templates
- tapOn:
    id: 'template-bbq'
- extendedWaitUntil:
    visible:
      id: 'screen-editor'
    timeout: 10000
- hideKeyboard
- scrollUntilVisible:
    element:
      id: 'editor-invite-olivia'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'editor-invite-olivia'
- tapOn:
    id: 'editor-invite-tom'
- scrollUntilVisible:
    element:
      id: 'editor-tpl-task-grill'
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- takeScreenshot: screenshots/shot-${PLATFORM}-18-editor-template-who
- tapOn:
    id: 'editor-save'
- extendedWaitUntil:
    notVisible:
      id: 'screen-editor'
    timeout: 10000
# Host view: guest list of the movie night (simulated answers arrived meanwhile)
- scrollUntilVisible:
    element:
      id: 'event-demo-movie-night'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'event-demo-movie-night'
- scrollUntilVisible:
    element:
      id: 'tile-guests'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'tile-guests'
- extendedWaitUntil:
    visible:
      id: 'screen-guests'
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: screenshots/shot-${PLATFORM}-19-guests-host
