name: Android build & emulator screenshots

# Prototype builds without EAS credentials (ADR 0008 – nothing is published):
#  - preview APK (release build, debug-signed, JS bundled) → installable test app + emulator screenshots
on:
  workflow_dispatch:
    inputs:
      commit_screenshots:
        description: 'Commit the captured screenshots to docs/previews/screenshots on this branch'
        type: boolean
        default: false
      screenshot_prefix:
        description: 'File name prefix, e.g. 2026-11-09-phase-01'
        type: string
        default: '2026-11-09-phase-01'
  push:
    branches: [main, 'claude/**']
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/android.yml'

concurrency:
  group: android-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build preview APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_VARIANT: preview
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile
      - name: Expo prebuild (android)
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install --clean
      - name: Gradle assembleRelease
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64,arm64-v8a --no-daemon
      - name: Check merged permissions (privacy)
        working-directory: apps/mobile
        run: |
          MANIFEST=$(find android/app/build/intermediates -path '*merged_manifest*' -name AndroidManifest.xml | head -1)
          echo "Manifest: $MANIFEST"
          grep -o 'android.permission.[A-Z_]*' "$MANIFEST" | sort -u | tee permissions.txt
          if grep -E 'RECORD_AUDIO|CAMERA|READ_CONTACTS|READ_MEDIA_|ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION|ACCESS_BACKGROUND_LOCATION' permissions.txt; then
            echo "::error::Privacy-sensitive permission found in merged manifest"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: nowish-preview-apk
          path: |
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            apps/mobile/permissions.txt
          retention-days: 14

  screenshots:
    name: Emulator run + Maestro screenshots
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nowish-preview-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Run on Android emulator (API 34, Pixel 6)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r "$(find apk -name '*.apk' | head -1)"
            adb shell cmd uimode night yes
            sleep 20
            maestro test -e PLATFORM=android -e APP_ID=dev.calendarplanner.app.preview apps/mobile/.maestro/screenshots.yaml --test-output-dir=maestro-output || (echo 'Retrying Maestro once'; sleep 10; maestro test -e PLATFORM=android -e APP_ID=dev.calendarplanner.app.preview apps/mobile/.maestro/screenshots.yaml --test-output-dir=maestro-output-retry) || (echo '=== logcat (ReactNativeJS) ==='; adb logcat -d -s ReactNativeJS:V ReactNative:V | tail -n 80; echo '=== ui texts ==='; maestro hierarchy > hierarchy.json; grep -oE '"(text|accessibilityText|resource-id)" : "[^"]+"' hierarchy.json | head -n 80; exit 1)
      - name: Collect screenshots
        if: always()
        run: |
          mkdir -p screenshots
          find . -path ./node_modules -prune -o -path ./screenshots -prune -o -name 'shot-*.png' -print | xargs -I{} cp {} screenshots/ || true
          ls -la screenshots
      - name: Commit screenshots to the branch (manual runs only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_screenshots }}
        env:
          PREFIX: ${{ inputs.screenshot_prefix }}
        run: |
          set -e
          mkdir -p docs/previews/screenshots
          for f in screenshots/shot-*.png; do
            base=$(basename "$f" .png); base=${base#shot-}
            cp "$f" "docs/previews/screenshots/${PREFIX}-${base}.png"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/previews/screenshots
          if git diff --cached --quiet; then echo "No screenshots to commit"; exit 0; fi
          git commit -m "docs: add Android emulator screenshots from CI run ${GITHUB_RUN_ID}"
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-screenshots
          path: |
            screenshots
            maestro-output*
          retention-days: 14
