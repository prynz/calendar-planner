<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Termin v5 – Konzept</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F4F5EF;text-decoration:none}
a:hover{color:#FFFFFF}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #141512; font-family: Inter, system-ui, sans-serif; color: #F4F5EF; position: relative; overflow: hidden">
  <div aria-hidden="true" style="position: absolute; top: -120px; left: -100px; width: 600px; height: 460px; border-radius: 50%; background: radial-gradient(closest-side, rgba(185,167,238,0.35) 0%, rgba(200,240,49,0.10) 55%, rgba(20,21,18,0) 100%)"></div>

  <div style="position: relative; height: 844px; overflow-y: auto; box-sizing: border-box; padding: 20px 24px 48px; display: flex; flex-direction: column; gap: 22px">

    <div style="display: flex; align-items: center; justify-content: space-between">
      <a href="HeuteV5.dc.html" aria-label="Zurück" style="width: 44px; height: 44px; border: 1px solid rgba(255,255,255,0.12); border-radius: 14px; background: rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F4F5EF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></a>
      <button type="button" aria-label="Mehr: Bearbeiten, Teilen, Löschen" style="width: 44px; height: 44px; border: 1px solid rgba(255,255,255,0.12); border-radius: 14px; background: rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: center; padding: 0">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="#F4F5EF"><circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle></svg></button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 14px; color: #A9AD9F">Olivia lädt ein · Demo</span>
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 32px; line-height: 36px; letter-spacing: -0.5px">Spieleabend bei Olivia</span>
      <span style="font-size: 15px; color: #A9AD9F">Fr, 13. Nov · 19:00 – 23:00 · Lindenstraße 8</span>
    </div>

    <div role="radiogroup" aria-label="Deine Antwort" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; border: 1px solid rgba(255,255,255,0.10); background: rgba(255,255,255,0.05); border-radius: 18px; padding: 5px">
      <sc-for list="{{answers}}" as="a" hint-placeholder-count="3">
        <button type="button" role="radio" aria-checked="{{a.sel}}" onClick="{{a.pick}}" style="{{a.style}}">{{a.label}}</button>
      </sc-for>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <button type="button" aria-label="Losgehen um 18:28 – Bereit-Check öffnen" style="grid-row: span 2; border: 0; border-radius: 26px; background: #C8F031; color: #141512; padding: 18px; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; text-align: start; box-shadow: 0 0 36px rgba(200,240,49,0.30)">
        <span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 14px; background: rgba(20,21,18,0.12); display: flex; align-items: center; justify-content: center">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#141512" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.5 2M9 2h6"></path></svg></span>
        <span style="flex: 1"></span>
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 44px; line-height: 44px">18:28</span>
        <span style="font-size: 14px; font-weight: 600">Losgehen</span>
        <span style="font-size: 13px">22 Min. Rad + 10 Puffer</span>
      </button>
      <sc-for list="{{tiles}}" as="t" hint-placeholder-count="2">
        <button type="button" style="border: 1px solid rgba(255,255,255,0.10); border-radius: 26px; background: rgba(255,255,255,0.06); color: #F4F5EF; padding: 16px; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: start">
          <span style="display: flex; align-items: baseline; gap: 4px"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 30px">{{t.value}}</span><span style="font-size: 13px; color: #A9AD9F">{{t.unit}}</span></span>
          <span style="font-size: 14px; color: #A9AD9F">{{t.label}}</span>
        </button>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="2">
        <button type="button" style="border: 1px solid rgba(255,255,255,0.10); border-radius: 20px; background: rgba(255,255,255,0.04); color: #F4F5EF; min-height: 56px; padding: 0 16px; display: flex; align-items: center; gap: 12px; text-align: start">
          <span style="flex: 1; font-size: 15px">{{r.label}}</span>
          <span style="font-size: 14px; color: #A9AD9F">{{r.value}}</span>
        </button>
      </sc-for>
      <button type="button" style="height: 48px; border: 0; background: transparent; color: #F4F5EF; font-size: 15px; font-weight: 600; text-decoration: underline">+ Umfrage oder Kosten</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { answer: 'yes' };
  }
  renderVals() {
    const answers = [['yes', 'Dabei'], ['maybe', 'Vielleicht'], ['no', 'Kann nicht']].map(([k, label]) => {
      const sel = this.state.answer === k;
      return {
        label, sel,
        style: 'height: 44px; border: 0; border-radius: 14px; font-size: 14px; font-weight: 600; ' +
          (sel ? 'background: #F4F5EF; color: #141512' : 'background: transparent; color: #A9AD9F'),
        pick: () => this.setState({ answer: k }),
      };
    });
    return {
      answers,
      tiles: [
        { value: '4', unit: 'von 6', label: 'Gäste dabei' },
        { value: '2', unit: 'neu', label: 'Chat' },
      ],
      rows: [
        { label: 'Mitbringliste', value: '1 von 2 vergeben' },
        { label: 'Aufgaben', value: '0 von 2' },
      ],
    };
  }
}
</script>
</body>
</html>
