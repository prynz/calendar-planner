<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Kalender v2 – Konzept</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0D0E12;text-decoration:none}
a:hover{color:#2A2E38}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF9F4; font-family: Inter, system-ui, sans-serif; color: #0D0E12; position: relative; overflow: hidden">
  <div style="height: 844px; overflow-y: auto; box-sizing: border-box; padding: 18px 20px 120px; display: flex; flex-direction: column; gap: 22px">

    <div style="display: flex; align-items: center; justify-content: space-between">
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 28px; letter-spacing: -0.5px">Kalender</span>
      <div role="tablist" aria-label="Ansicht" style="display: flex; gap: 4px; background: #FFFFFF; border-radius: 22px; padding: 4px; box-shadow: 0 4px 16px rgba(13,14,18,0.05)">
        <sc-for list="{{views}}" as="v" hint-placeholder-count="3">
          <button type="button" role="tab" aria-selected="{{v.sel}}" onClick="{{v.pick}}" style="{{v.style}}">{{v.label}}</button>
        </sc-for>
      </div>
    </div>

    <div role="group" aria-label="Wessen Termine" style="display: flex; gap: 8px; align-items: center">
      <sc-for list="{{people}}" as="p" hint-placeholder-count="5">
        <button type="button" onClick="{{p.pick}}" aria-pressed="{{p.pressed}}" aria-label="{{p.name}}" style="{{p.style}}">
          <span aria-hidden="true" style="{{p.avatar}}">{{p.initial}}</span>
          <sc-if value="{{p.selected}}" hint-placeholder-val="{{ false }}"><span>{{p.name}}</span></sc-if>
        </button>
      </sc-for>
    </div>

    <div style="background: #FFFFFF; border-radius: 24px; padding: 14px 10px; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 8px 28px rgba(13,14,18,0.05)">
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 6px 6px">
        <button type="button" aria-label="Voriger Monat" style="width: 40px; height: 40px; border: 0; border-radius: 20px; background: #F6F2EA; display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0D0E12" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></button>
        <span style="font-weight: 600; font-size: 16px">November 2026</span>
        <button type="button" aria-label="Nächster Monat" style="width: 40px; height: 40px; border: 0; border-radius: 20px; background: #F6F2EA; display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0D0E12" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg></button>
      </div>
      <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); text-align: center; font-size: 12px; font-weight: 600; color: #8A8F9A">
        <span>Mo</span><span>Di</span><span>Mi</span><span>Do</span><span>Fr</span><span>Sa</span><span>So</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: 2px">
        <sc-for list="{{cells}}" as="c" hint-placeholder-count="42">
          <button type="button" onClick="{{c.pick}}" aria-label="{{c.label}}" style="{{c.style}}">
            <span>{{c.n}}</span>
            <span aria-hidden="true" style="{{c.dot}}"></span>
          </button>
        </sc-for>
      </div>
    </div>

    <section aria-label="{{dayTitle}}" style="display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: baseline; justify-content: space-between">
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 20px">{{dayTitle}}</span>
        <span style="font-size: 13px; color: #5B5F69">{{dayCount}}</span>
      </div>
      <div style="background: #FFFFFF; border-radius: 24px; padding: 4px 16px; box-shadow: 0 8px 28px rgba(13,14,18,0.05)">
        <sc-for list="{{agenda}}" as="e" hint-placeholder-count="3">
          <a href="TerminV2.dc.html" style="{{e.row}}">
            <span aria-hidden="true" style="{{e.avatar}}">{{e.initial}}</span>
            <div style="flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0">
              <span style="font-weight: 600; font-size: 15px">{{e.title}}</span>
              <span style="font-size: 13px; color: #5B5F69">{{e.place}}</span>
            </div>
            <span style="font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums">{{e.time}}</span>
          </a>
        </sc-for>
        <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
          <div style="padding: 18px 0; display: flex; justify-content: space-between; align-items: center; gap: 12px">
            <span style="font-size: 14px; color: #5B5F69">Frei an diesem Tag.</span>
            <button type="button" style="height: 40px; padding: 0 16px; border: 0; border-radius: 20px; background: #0D0E12; color: #FBF9F4; font-weight: 600; font-size: 14px">Eintragen</button>
          </div>
        </sc-if>
      </div>
    </section>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 22px; display: flex; gap: 10px; align-items: center">
    <nav aria-label="Hauptnavigation" style="flex: 1; height: 64px; border-radius: 32px; background: #0D0E12; display: flex; align-items: center; justify-content: space-between; padding: 0 8px">
      <a href="HeuteV2.dc.html" aria-label="Heute" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #A3A9B7">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></a>
      <a href="KalenderV2.dc.html" aria-current="page" style="height: 48px; padding: 0 16px; border-radius: 24px; background: #C8F031; color: #0D0E12; display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 14px">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Kalender</a>
      <a href="TerminV2.dc.html" aria-label="Gemeinsam" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #A3A9B7">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"></path><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c1.8.7 3 2.5 3.5 5.2"></path></svg></a>
      <a href="Personalisieren.dc.html" aria-label="Ich" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #A3A9B7">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1-4 4.2-6 8-6s7 2 8 6"></path></svg></a>
    </nav>
    <button type="button" aria-label="Neuer Termin" style="width: 64px; height: 64px; border: 0; border-radius: 32px; background: #C8F031; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0D0E12" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { person: 'all', day: 12, view: 'month' };
  }
  renderVals() {
    const ppl = { me: ['Du', 'D', '#EDE7FF'], sam: ['Sam', 'S', '#E3F4E8'], lena: ['Lena', 'L', '#FFF1E6'], fam: ['Familie', 'F', '#E4F5F9'] };
    const events = [
      [9, 'me', 'Teammeeting', 'Büro', '09:00'],
      [12, 'me', 'Zahnarzt', 'Praxis am Markt', '11:00'],
      [12, 'me', 'Mittagessen mit Alex', 'Café Lindner', '12:30'],
      [12, 'sam', 'Schwimmen', 'Hallenbad Nord', '15:30'],
      [12, 'me', 'Spieleabend', 'bei Olivia', '19:00'],
      [13, 'lena', 'Flötenunterricht', 'Musikschule', '16:00'],
      [14, 'sam', 'Fußballturnier', 'Sportplatz', '09:00'],
      [14, 'fam', 'Familienbrunch', 'bei Oma', '10:30'],
      [17, 'me', 'Grillabend am See', 'Badestelle Ost', '16:00'],
      [20, 'lena', 'Kindergeburtstag Mia', 'bei Mia', '14:00'],
      [26, 'fam', 'Elternabend', 'Schule', '19:30'],
    ];
    const person = this.state.person;
    const visible = events.filter((e) => person === 'all' || e[1] === person);
    const people = [['all', 'Alle', 'A', '#F1ECE2']].concat(Object.keys(ppl).map((k) => [k, ppl[k][0], ppl[k][1], ppl[k][2]])).map(([id, name, initial, bg]) => {
      const sel = person === id;
      return {
        name, initial,
        selected: sel,
        pressed: sel ? 'true' : 'false',
        pick: () => this.setState({ person: id }),
        style: 'height: 44px; ' + (sel ? 'padding: 0 14px 0 5px' : 'width: 44px; padding: 0; justify-content: center') + '; border-radius: 22px; display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; border: 1.5px solid ' + (sel ? '#0D0E12' : '#E7E0D2') + '; background: ' + (sel ? '#0D0E12' : '#FFFFFF') + '; color: ' + (sel ? '#FBF9F4' : '#0D0E12'),
        avatar: 'width: 32px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; color: #0D0E12; background: ' + bg,
      };
    });
    const cells = [];
    for (let i = 0; i < 42; i++) {
      const n = i - 5;
      if (n < 1 || n > 30) {
        cells.push({ n: '', label: 'leer', pick: () => {}, dot: 'display: none', style: 'height: 46px; border: 0; background: transparent' });
        continue;
      }
      const count = visible.filter((e) => e[0] === n).length;
      const sel = this.state.day === n;
      cells.push({
        n,
        label: n + '. November, ' + (count === 0 ? 'frei' : count + (count === 1 ? ' Termin' : ' Termine')),
        pick: () => this.setState({ day: n }),
        dot: 'width: 5px; height: 5px; border-radius: 3px; background: ' + (count === 0 ? 'transparent' : sel ? '#C8F031' : '#0D0E12'),
        style: 'height: 46px; border: 0; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-weight: 600; font-size: 15px; padding: 0; background: ' + (sel ? '#0D0E12' : n === 12 ? '#F1ECE2' : 'transparent') + '; color: ' + (sel ? '#FBF9F4' : '#0D0E12'),
      });
    }
    const day = this.state.day;
    const list = visible.filter((e) => e[0] === day);
    const wd = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'][(day + 5) % 7];
    const views = [['day', 'Tag'], ['week', 'Woche'], ['month', 'Monat']].map(([id, label]) => {
      const sel = this.state.view === id;
      return {
        label,
        sel: sel ? 'true' : 'false',
        pick: () => this.setState({ view: id }),
        style: 'height: 36px; padding: 0 12px; border: 0; border-radius: 18px; font-weight: 600; font-size: 13px; background: ' + (sel ? '#0D0E12' : 'transparent') + '; color: ' + (sel ? '#FBF9F4' : '#0D0E12'),
      };
    });
    return {
      views,
      people,
      cells,
      dayTitle: (day === 12 ? 'Heute · ' : '') + wd + ', ' + day + '. Nov.',
      dayCount: list.length === 1 ? '1 Termin' : list.length + ' Termine',
      empty: list.length === 0,
      agenda: list.map((e, i) => ({
        title: e[2], place: e[3], time: e[4], initial: ppl[e[1]][1],
        row: 'display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 8px 0; ' + (i < list.length - 1 ? 'border-bottom: 1px solid #F1ECE2' : ''),
        avatar: 'width: 36px; height: 36px; border-radius: 18px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; background: ' + ppl[e[1]][2],
      })),
    };
  }
}
</script>
</body>
</html>
