<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Heute v7 – Konzept</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0D0E12;text-decoration:none}
a:hover{color:#2A2E38}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: Inter, system-ui, sans-serif; color: #0D0E12; position: relative; overflow: hidden">
  <div style="height: 844px; overflow-y: auto; box-sizing: border-box; padding: 20px 20px 110px; display: flex; flex-direction: column; gap: 18px">

    <div style="display: flex; align-items: flex-end; justify-content: space-between">
      <span style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 15px; font-weight: 600; color: #E5484D">Freitag</span>
        <span style="font-weight: 800; font-size: 34px; letter-spacing: -1px">13. November</span>
      </span>
      <span style="font-size: 12px; font-weight: 600; color: #4B2FD6; background: #EDE7FF; padding: 4px 9px; border-radius: 999px">Demo</span>
    </div>

    <a href="MonatV7.dc.html" style="border-radius: 22px; background: #0D0E12; color: #FFFFFF; padding: 16px 18px; display: flex; align-items: center; gap: 14px">
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 13px; color: #C9CCD3">Zahnarzt 08:30 · Praxis Dr. Sommer</span>
        <span style="display: flex; align-items: baseline; gap: 8px"><span style="font-weight: 800; font-size: 34px; letter-spacing: -1px">07:55</span><span style="font-size: 15px; font-weight: 600; color: #C8F031">los · in 25 Min.</span></span>
      </span>
      <span aria-hidden="true" style="width: 48px; height: 48px; border-radius: 24px; background: #C8F031; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0D0E12" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span>
    </a>

    <div role="img" aria-label="Tagesplan von 7 bis 22 Uhr mit 6 Terminen, jetzt 7:30 Uhr" style="position: relative; height: 900px">
      <sc-for list="{{hours}}" as="h" hint-placeholder-count="16">
        <div style="{{h.style}}">
          <span style="width: 40px; font-size: 12px; color: #8A8F9A; transform: translateY(-8px)">{{h.label}}</span>
          <span style="flex: 1; border-top: 1px solid #EEEAE2"></span>
        </div>
      </sc-for>
      <sc-for list="{{blocks}}" as="b" hint-placeholder-count="6">
        <span style="{{b.style}}">
          <span style="font-weight: 700; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{b.title}}</span>
          <span style="font-size: 12px; opacity: 0.85">{{b.time}}</span>
        </span>
      </sc-for>
      <span style="position: absolute; left: 40px; right: 0; top: 30px; display: flex; align-items: center">
        <span style="font-size: 11px; font-weight: 700; color: #0D0E12; background: #C8F031; border-radius: 8px; padding: 2px 6px; margin-left: -44px">07:30</span>
        <span style="flex: 1; height: 2px; background: #0D0E12"></span>
      </span>
    </div>
  </div>

  <nav aria-label="Hauptnavigation" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: rgba(255,255,255,0.96); border-top: 1px solid #EEEAE2; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: start; padding-top: 8px">
    <a href="HeuteV7.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 48px">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0D0E12" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"></path></svg>
      <span style="font-size: 11px; font-weight: 700">Heute</span></a>
    <a href="MonatV7.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 48px; color: #6B6F7A">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B6F7A" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
      <span style="font-size: 11px; font-weight: 500">Kalender</span></a>
    <span style="display: flex; justify-content: center">
      <button type="button" aria-label="Neuer Termin" style="width: 52px; height: 52px; border: 0; border-radius: 26px; background: #0D0E12; display: flex; align-items: center; justify-content: center; padding: 0; margin-top: -6px">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#C8F031" stroke-width="2.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></button></span>
    <a href="WocheV7.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 48px; color: #6B6F7A">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B6F7A" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="4"></circle><path d="M2 21c0-4 3-6 7-6s7 2 7 6M16 4a4 4 0 0 1 0 8M22 21c0-3-2-5-4-6"></path></svg>
      <span style="font-size: 11px; font-weight: 500">Gemeinsam</span></a>
    <a href="WidgetsV7.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 48px; color: #6B6F7A">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B6F7A" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 4-6 8-6s8 2 8 6"></path></svg>
      <span style="font-size: 11px; font-weight: 500">Ich</span></a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const H = 56; // px per hour
    const start = 7;
    const hours = [];
    for (let h = start; h <= 22; h++) {
      hours.push({ label: String(h).padStart(2, '0'), style: 'position: absolute; left: 0; right: 0; top: ' + ((h - start) * H) + 'px; display: flex; align-items: flex-start' });
    }
    const pal = {
      sky: ['#DDF1FA', '#0E5F78', '#7FC8E0'],
      lav: ['#EDE7FF', '#4B2FD6', '#B9A7EE'],
      peach: ['#FFE8D6', '#9A3F0B', '#FFB98C'],
      mint: ['#E3F5DA', '#2F6B1F', '#9BD38A'],
      rose: ['#FDE3EA', '#9E2347', '#F2A0B6'],
    };
    const ev = [
      [7, 8, 'Physio', '07:00 – 08:00', 'rose', 0, 1],
      [8.5, 9.25, 'Zahnarzt', '08:30 – 09:15', 'sky', 0, 1],
      [12.5, 13.5, 'Mittagessen mit Alex', '12:30 – 13:30', 'lav', 0, 1],
      [16, 21, 'Grillen (Familie)', '16:00 – 21:00', 'mint', 0, 2],
      [17.75, 18.67, 'Friseur', '17:45 – 18:40', 'peach', 1, 2],
      [19, 23, 'Spieleabend bei Olivia', '19:00 – 23:00', 'lav', 1, 2],
    ];
    const blocks = ev.map(([a, b, title, time, c, col, cols]) => {
      const p = pal[c];
      const w = 'calc((100% - 48px) / ' + cols + ' - 4px)';
      const left = 'calc(48px + (100% - 48px) / ' + cols + ' * ' + col + ')';
      return {
        title, time,
        style: 'position: absolute; top: ' + ((a - start) * H + 2) + 'px; height: ' + Math.max(36, (b - a) * H - 4) + 'px; left: ' + left + '; width: ' + w + '; box-sizing: border-box; border-radius: 12px; padding: 6px 10px; background: ' + p[0] + '; color: ' + p[1] + '; border-left: 4px solid ' + p[2] + '; display: flex; flex-direction: column; gap: 1px; overflow: hidden',
      };
    });
    return { hours, blocks };
  }
}
</script>
</body>
</html>
