<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Familie v4 – Konzept</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0D0E12;text-decoration:none}
a:hover{color:#2A2E38}
button{font:inherit;cursor:pointer}
@keyframes driftA{0%{transform:translate(0,0)}100%{transform:translate(-40px,50px)}}
@keyframes rise{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
.auraA{animation:driftA 15s ease-in-out infinite alternate}
.rise{animation:rise 520ms cubic-bezier(.2,.9,.3,1) both}
.bar{transition:width 600ms cubic-bezier(.2,.9,.3,1)}
@media (prefers-reduced-motion: reduce){.auraA,.rise{animation:none}.bar{transition:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF8F4; font-family: Inter, system-ui, sans-serif; color: #0D0E12; position: relative; overflow: hidden">
  <div aria-hidden="true" class="auraA" style="position: absolute; top: -170px; right: -150px; width: 540px; height: 500px; border-radius: 50%; background: radial-gradient(closest-side, #D9F2C4 0%, #FFE8C9 45%, rgba(251,248,244,0) 100%)"></div>

  <div style="position: relative; height: 844px; overflow-y: auto; box-sizing: border-box; padding: 20px 24px 130px; display: flex; flex-direction: column; gap: 22px">

    <div style="display: flex; align-items: center; justify-content: space-between">
      <a href="GemeinsamV4.dc.html" aria-label="Zurück zu Gemeinsam" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,0.8); display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0D0E12" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></a>
      <span style="font-size: 12px; font-weight: 600; color: #4B2FD6; background: rgba(255,255,255,0.75); padding: 4px 9px; border-radius: 999px">Demo</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 14px; color: #4A4E58">Familie Berger · heute</span>
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 30px; letter-spacing: -0.5px">Wer macht was?</span>
    </div>

    <div role="group" aria-label="Familienmitglieder" style="display: flex; justify-content: space-between">
      <sc-for list="{{people}}" as="p" hint-placeholder-count="4">
        <button type="button" onClick="{{p.pick}}" aria-pressed="{{p.sel}}" style="border: 0; background: transparent; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; width: 76px">
          <span aria-hidden="true" style="{{p.ring}}"><span style="{{p.avatar}}">{{p.initial}}</span></span>
          <span style="font-size: 13px; font-weight: 600">{{p.name}}</span>
          <span style="font-size: 11px; color: #4A4E58; text-align: center">{{p.next}}</span>
        </button>
      </sc-for>
    </div>

    <section class="rise" aria-label="Offene Fahrt" style="border-radius: 32px; background: linear-gradient(150deg, #D9F2C4 0%, #FFF1C9 100%); padding: 20px; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 16px 36px rgba(90,120,40,0.12)">
      <span style="font-size: 12px; font-weight: 600; background: rgba(255,255,255,0.7); padding: 4px 10px; border-radius: 999px; align-self: flex-start">Fahrt offen</span>
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 24px; line-height: 28px; margin-top: 4px">Lena vom Schwimmkurs abholen</span>
      <span style="font-size: 14px">Sa · 16:00 · Hallenbad Mitte</span>
      <sc-if value="{{rideOpen}}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; gap: 8px; margin-top: 10px">
          <button type="button" onClick="{{takeRide}}" style="flex: 1; height: 50px; border: 0; border-radius: 25px; background: #0D0E12; color: #FFFFFF; font-size: 15px; font-weight: 600">Ich fahre</button>
          <button type="button" onClick="{{askSam}}" style="flex: 1; height: 50px; border: 0; border-radius: 25px; background: rgba(255,255,255,0.75); font-size: 15px; font-weight: 600">Sam fragen</button>
        </div>
      </sc-if>
      <sc-if value="{{rideDone}}" hint-placeholder-val="{{ false }}">
        <span style="font-size: 15px; font-weight: 600; margin-top: 8px">{{rideText}}</span>
      </sc-if>
    </section>

    <div class="rise" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <button type="button" onClick="{{buy}}" style="border: 0; border-radius: 28px; background: #FFFFFF; padding: 18px; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; text-align: start; box-shadow: 0 8px 24px rgba(13,14,18,0.05)">
        <span style="font-size: 13px; font-weight: 600; color: #4A4E58">Einkauf</span>
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 34px; line-height: 38px">{{shopLeft}}</span>
        <span style="font-size: 13px; color: #4A4E58">noch offen · tippen = eins erledigt</span>
        <span aria-hidden="true" style="width: 100%; height: 6px; border-radius: 3px; background: #F1ECE2; overflow: hidden"><span class="bar" style="display: block; height: 6px; border-radius: 3px; background: #7C5CFF; width: {{shopPct}}"></span></span>
      </button>
      <div style="border-radius: 28px; background: #FFFFFF; padding: 18px; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 8px 24px rgba(13,14,18,0.05)">
        <span style="font-size: 13px; font-weight: 600; color: #4A4E58">Ämtchen</span>
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 34px; line-height: 38px">1/2</span>
        <span style="font-size: 13px; color: #4A4E58">Paul: Spülmaschine</span>
        <span aria-hidden="true" style="width: 100%; height: 6px; border-radius: 3px; background: #F1ECE2; overflow: hidden"><span style="display: block; height: 6px; width: 50%; border-radius: 3px; background: #FFB98C"></span></span>
      </div>
    </div>
  </div>

  <nav aria-label="Hauptnavigation" style="position: absolute; left: 0; right: 0; bottom: 0; height: 92px">
    <svg aria-hidden="true" width="390" height="92" viewBox="0 0 390 92" style="position: absolute; left: 0; top: 0; filter: drop-shadow(0 -6px 18px rgba(75,47,214,0.10))">
      <path d="M0 24 Q0 0 24 0 H139 C154 0 157 4 161 12 A38 38 0 0 0 229 12 C233 4 236 0 251 0 H366 Q390 0 390 24 V92 H0 Z" fill="#FFFFFF"></path>
    </svg>
    <div style="position: absolute; left: 0; right: 0; top: 10px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: start">
      <a href="HeuteV4.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 48px; color: #6B6F7A">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B6F7A" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"></path></svg>
        <span style="font-size: 11px; font-weight: 500">Heute</span></a>
      <a href="KalenderV4.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 48px; color: #6B6F7A">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B6F7A" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
        <span style="font-size: 11px; font-weight: 500">Kalender</span></a>
      <span></span>
      <a href="GemeinsamV4.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 48px; color: #0D0E12">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0D0E12" stroke-width="2.2" stroke-linecap="round"><circle cx="9" cy="8" r="4"></circle><path d="M2 21c0-4 3-6 7-6s7 2 7 6M16 4a4 4 0 0 1 0 8M22 21c0-3-2-5-4-6"></path></svg>
        <span style="font-size: 11px; font-weight: 700">Gemeinsam</span></a>
      <a href="IchV4.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 48px; color: #6B6F7A">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B6F7A" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 4-6 8-6s8 2 8 6"></path></svg>
        <span style="font-size: 11px; font-weight: 500">Ich</span></a>
    </div>
    <button type="button" aria-label="Neuer Termin" style="position: absolute; left: 50%; top: -34px; transform: translateX(-50%); width: 62px; height: 62px; border: 0; border-radius: 31px; background: linear-gradient(145deg, #9B7DFF, #6A4CF0); display: flex; align-items: center; justify-content: center; padding: 0; box-shadow: 0 12px 26px rgba(106,76,240,0.40)">
      <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 'lena', ride: null, bought: 0 };
  }
  renderVals() {
    const people = [
      ['me', 'Du', 'D', '#E4DAFB', 'Zahnarzt 08:30'],
      ['sam', 'Sam', 'S', '#CDEFF6', 'Büro bis 17'],
      ['lena', 'Lena', 'L', '#FFE0C7', 'Schwimmen Sa'],
      ['paul', 'Paul', 'P', '#FFD0C4', 'Fußball 15:00'],
    ].map(([id, name, initial, c, next]) => {
      const sel = this.state.sel === id;
      return {
        name, initial, next, sel,
        ring: 'width: 64px; height: 64px; border-radius: 32px; display: flex; align-items: center; justify-content: center; ' +
          (sel ? 'background: conic-gradient(#7C5CFF, #FFB98C, #7C5CFF)' : 'background: transparent'),
        avatar: 'width: 56px; height: 56px; border-radius: 28px; background: ' + c + '; border: 3px solid #FBF8F4; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px',
        pick: () => this.setState({ sel: id }),
      };
    });
    const total = 5;
    const left = Math.max(0, total - this.state.bought);
    return {
      people,
      rideOpen: this.state.ride === null,
      rideDone: this.state.ride !== null,
      rideText: this.state.ride === 'me' ? 'Du fährst – steht in deinem Kalender.' : 'Sam ist gefragt (Demo).',
      takeRide: () => this.setState({ ride: 'me' }),
      askSam: () => this.setState({ ride: 'sam' }),
      shopLeft: String(left),
      shopPct: Math.round((this.state.bought / total) * 100) + '%',
      buy: () => this.setState({ bought: Math.min(total, this.state.bought + 1) }),
    };
  }
}
</script>
</body>
</html>
