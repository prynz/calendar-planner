<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Termin v3 – Konzept</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0D0E12;text-decoration:none}
a:hover{color:#2A2E38}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF9F4; font-family: Inter, system-ui, sans-serif; color: #0D0E12; position: relative; overflow: hidden">
  <div style="height: 844px; overflow-y: auto; box-sizing: border-box; padding: 20px 24px 48px; display: flex; flex-direction: column; gap: 28px">

    <div style="display: flex; justify-content: space-between; align-items: center">
      <a href="HeuteV3.dc.html" aria-label="Zurück" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0D0E12" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></a>
      <div style="display: flex; align-items: center; gap: 8px">
        <span style="font-size: 12px; font-weight: 600; color: #4B2FD6; border: 1px solid #C9C0F2; padding: 3px 8px; border-radius: 999px">Demo</span>
        <button type="button" aria-label="Mehr: Bearbeiten, Teilen, Löschen" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; padding: 0">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="#0D0E12"><circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle></svg></button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <span style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: #5B5F69"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 4px; background: #B9A7EE"></span>Olivia lädt ein</span>
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 30px; line-height: 34px; letter-spacing: -0.5px">Spieleabend bei Olivia</span>
      <span style="font-size: 16px">Fr, 13. Nov · 19:00 – 23:00</span>
      <span style="font-size: 16px; color: #5B5F69">Lindenstraße 8</span>
    </div>

    <div role="radiogroup" aria-label="Deine Antwort" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; background: #F1ECE2; border-radius: 26px; padding: 4px">
      <sc-for list="{{answers}}" as="a" hint-placeholder-count="3">
        <button type="button" role="radio" aria-checked="{{a.sel}}" onClick="{{a.pick}}" style="{{a.style}}">{{a.label}}</button>
      </sc-for>
    </div>

    <div style="display: flex; align-items: baseline; justify-content: space-between; border-top: 1px solid #EFE9DC; border-bottom: 1px solid #EFE9DC; padding: 16px 0">
      <span style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 14px; color: #5B5F69">Losgehen</span>
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 26px">18:28</span>
      </span>
      <span style="font-size: 14px; color: #5B5F69">22 Min. Rad + 10 Min. Puffer</span>
    </div>

    <section aria-label="Gemeinsam" style="display: flex; flex-direction: column">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
        <button type="button" style="min-height: 56px; border: 0; border-bottom: 1px solid #EFE9DC; background: transparent; padding: 0; display: flex; align-items: center; gap: 12px; text-align: start; font-size: 16px; color: #0D0E12">
          <span style="flex: 1">{{r.label}}</span>
          <span style="font-size: 15px; color: #5B5F69">{{r.value}}</span>
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A3A9B7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg>
        </button>
      </sc-for>
      <button type="button" style="height: 52px; border: 0; background: transparent; padding: 0; text-align: start; font-size: 15px; font-weight: 600; color: #0D0E12; display: flex; align-items: center; gap: 8px">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0D0E12" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
        Umfrage oder Kosten hinzufügen</button>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { answer: 'yes' };
  }
  renderVals() {
    const answers = [['yes', 'Dabei'], ['maybe', 'Vielleicht'], ['no', 'Kann nicht']].map(([k, label]) => {
      const sel = this.state.answer === k;
      return {
        label, sel,
        style: 'height: 44px; border: 0; border-radius: 22px; font-size: 15px; font-weight: 600; ' +
          (sel ? 'background: #C8F031; color: #0D0E12' : 'background: transparent; color: #5B5F69'),
        pick: () => this.setState({ answer: k }),
      };
    });
    return {
      answers,
      rows: [
        { label: 'Gäste', value: '4 von 6 dabei' },
        { label: 'Mitbringliste', value: '1 von 2 vergeben' },
        { label: 'Aufgaben', value: '0 von 2' },
        { label: 'Chat', value: '2 neu' },
      ],
    };
  }
}
</script>
</body>
</html>
