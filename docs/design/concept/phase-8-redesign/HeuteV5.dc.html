<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Heute v5 – Konzept</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F4F5EF;text-decoration:none}
a:hover{color:#FFFFFF}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #141512; font-family: Inter, system-ui, sans-serif; color: #F4F5EF; position: relative; overflow: hidden">
  <div aria-hidden="true" style="position: absolute; top: 120px; left: -60px; width: 520px; height: 520px; border-radius: 50%; background: radial-gradient(closest-side, rgba(200,240,49,0.28) 0%, rgba(200,240,49,0.06) 55%, rgba(20,21,18,0) 100%)"></div>

  <div style="position: relative; height: 844px; overflow-y: auto; box-sizing: border-box; padding: 20px 24px 120px; display: flex; flex-direction: column; gap: 22px">

    <div style="display: flex; align-items: center; justify-content: space-between">
      <button type="button" aria-label="Menü" style="width: 44px; height: 44px; border: 1px solid rgba(255,255,255,0.12); border-radius: 14px; background: rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: center; padding: 0">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F4F5EF" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h10M4 17h16"></path></svg></button>
      <span style="font-size: 12px; font-weight: 600; color: #141512; background: #B9A7EE; padding: 4px 9px; border-radius: 999px">Demo</span>
      <a href="HeuteV5.dc.html" aria-label="Ich" style="width: 44px; height: 44px; border: 1px solid rgba(255,255,255,0.12); border-radius: 14px; background: rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F4F5EF" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 4-6 8-6s8 2 8 6"></path></svg></a>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 14px; color: #A9AD9F">Freitag, 13. November</span>
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 30px; line-height: 34px; letter-spacing: -0.5px">Zahnarzt um 08:30</span>
    </div>

    <div style="position: relative; width: 280px; height: 280px; align-self: center">
      <svg role="img" aria-label="Noch 25 Minuten bis zum Losgehen um 07:55" width="280" height="280" viewBox="0 0 280 280">
        <circle cx="140" cy="140" r="120" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="22"></circle>
        <circle cx="140" cy="140" r="120" fill="none" stroke="#C8F031" stroke-width="22" stroke-linecap="round" stroke-dasharray="{{arc}}" transform="rotate(-90 140 140)"></circle>
        <circle cx="140" cy="140" r="88" fill="#1E1F1B"></circle>
      </svg>
      <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
        <span style="font-size: 13px; color: #A9AD9F">los in</span>
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 56px; line-height: 56px">{{left}}</span>
        <span style="font-size: 13px; color: #A9AD9F">Min. · um 07:55</span>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 12px">
      <span style="flex: 1; font-size: 14px; color: #A9AD9F">20 Min. Rad + 10 Min. Puffer · Praxis Dr. Sommer</span>
      <button type="button" onClick="{{go}}" aria-label="{{goLabel}}" style="width: 64px; height: 64px; border: 0; border-radius: 22px; background: #C8F031; display: flex; align-items: center; justify-content: center; padding: 0; box-shadow: 0 0 32px rgba(200,240,49,0.45)">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#141512" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <a href="KalenderV5.dc.html" style="border: 1px solid rgba(255,255,255,0.10); border-radius: 24px; padding: 16px; background: rgba(255,255,255,0.06); display: flex; flex-direction: column; gap: 4px">
        <span style="display: flex; align-items: baseline; gap: 6px"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 32px">5</span><span style="font-size: 13px; color: #A9AD9F">Termine</span></span>
        <span style="font-size: 13px; color: #A9AD9F">noch heute</span>
      </a>
      <div style="border: 1px solid rgba(255,255,255,0.10); border-radius: 24px; padding: 16px; background: rgba(255,255,255,0.06); display: flex; flex-direction: column; gap: 4px">
        <span style="display: flex; align-items: baseline; gap: 6px"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 32px">3</span><span style="font-size: 13px; color: #A9AD9F">Std. frei</span></span>
        <span style="font-size: 13px; color: #A9AD9F">ab 13:30</span>
      </div>
    </div>

    <button type="button" style="border: 1px solid rgba(255,165,110,0.35); border-radius: 20px; background: rgba(255,140,80,0.10); padding: 14px 16px; display: flex; align-items: center; gap: 12px; text-align: start; color: #F4F5EF">
      <span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 4px; background: #FFA56E; flex-shrink: 0"></span>
      <span style="flex: 1; font-size: 15px">Spieleabend → Physio wird knapp</span>
      <span style="font-size: 14px; font-weight: 600">Lösen</span>
    </button>
  </div>

  <nav aria-label="Hauptnavigation" style="position: absolute; left: 24px; right: 24px; bottom: 24px; height: 64px; border-radius: 22px; border: 1px solid rgba(255,255,255,0.10); background: rgba(34,35,31,0.92); display: flex; align-items: center; justify-content: space-around">
    <a href="HeuteV5.dc.html" aria-current="page" aria-label="Heute" style="width: 48px; height: 48px; border-radius: 16px; background: rgba(200,240,49,0.16); display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C8F031" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"></path></svg></a>
    <a href="KalenderV5.dc.html" aria-label="Kalender" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A9AD9F" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg></a>
    <button type="button" aria-label="Neuer Termin" style="width: 48px; height: 48px; border: 0; border-radius: 16px; background: rgba(255,255,255,0.10); display: flex; align-items: center; justify-content: center; padding: 0">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F4F5EF" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></button>
    <a href="GemeinsamV5.dc.html" aria-label="Gemeinsam" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A9AD9F" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="4"></circle><path d="M2 21c0-4 3-6 7-6s7 2 7 6M16 4a4 4 0 0 1 0 8M22 21c0-3-2-5-4-6"></path></svg></a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { going: false };
  }
  renderVals() {
    const left = 25;
    const total = 60;
    const c = 2 * Math.PI * 120;
    const filled = c * (1 - left / total);
    return {
      left: this.state.going ? '0' : String(left),
      arc: (this.state.going ? c : filled) + ' ' + c,
      goLabel: this.state.going ? 'Unterwegs – zurücknehmen' : 'Bin unterwegs',
      go: () => this.setState({ going: !this.state.going }),
    };
  }
}
</script>
</body>
</html>
