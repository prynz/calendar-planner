<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Kalender v4 – Konzept</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0D0E12;text-decoration:none}
a:hover{color:#2A2E38}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF8F4; font-family: Inter, system-ui, sans-serif; color: #0D0E12; position: relative; overflow: hidden">
  <div aria-hidden="true" style="position: absolute; top: -180px; left: -120px; width: 640px; height: 560px; border-radius: 50%; background: radial-gradient(closest-side, #FFD7BA 0%, #F6DDE8 50%, rgba(251,248,244,0) 100%)"></div>

  <div style="position: relative; height: 844px; overflow-y: auto; box-sizing: border-box; padding: 20px 24px 120px; display: flex; flex-direction: column; gap: 26px">

    <div style="display: flex; align-items: center; justify-content: space-between">
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 28px; letter-spacing: -0.5px">November</span>
      <div style="display: flex; gap: 8px">
        <button type="button" aria-label="Wessen Termine: alle" style="height: 44px; border: 0; border-radius: 22px; background: rgba(255,255,255,0.8); padding: 0 14px; font-size: 14px; font-weight: 600; box-shadow: 0 6px 18px rgba(13,14,18,0.06)">Alle</button>
        <button type="button" aria-label="Monatsansicht" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: rgba(255,255,255,0.8); display: flex; align-items: center; justify-content: center; padding: 0; box-shadow: 0 6px 18px rgba(13,14,18,0.06)">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0D0E12" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg></button>
      </div>
    </div>

    <div role="group" aria-label="Tag wählen" style="display: flex; align-items: flex-end; justify-content: space-between; padding: 8px 4px 0">
      <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
        <button type="button" onClick="{{d.pick}}" aria-pressed="{{d.sel}}" aria-label="{{d.label}}" style="border: 0; background: transparent; padding: 0; min-width: 44px; display: flex; flex-direction: column; align-items: center; gap: 4px">
          <span style="{{d.num}}">{{d.n}}</span>
          <span style="font-size: 12px; color: #4A4E58">{{d.wd}}</span>
          <span aria-hidden="true" style="{{d.dot}}"></span>
        </button>
      </sc-for>
    </div>

    <div aria-hidden="true" style="height: 6px; border-radius: 3px; background: linear-gradient(90deg, #E4DAFB, #FFC9A6, #E4DAFB)"></div>

    <section aria-label="{{dayTitle}}" style="display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <span style="font-weight: 600; font-size: 17px">{{dayTitle}}</span>
        <span style="font-size: 14px; color: #4A4E58">{{count}}</span>
      </div>
      <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
        <div style="border-radius: 28px; background: #FFFFFF; padding: 24px; font-size: 15px; color: #4A4E58; box-shadow: 0 8px 24px rgba(13,14,18,0.05)">Frei – nichts geplant.</div>
      </sc-if>
      <sc-for list="{{items}}" as="r" hint-placeholder-count="4">
        <a href="TerminV4.dc.html" style="{{r.card}}">
          <span style="display: flex; flex-direction: column; align-items: flex-start; min-width: 56px">
            <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 22px">{{r.time}}</span>
            <span style="font-size: 12px; color: #4A4E58">{{r.end}}</span>
          </span>
          <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
            <span style="font-weight: 600; font-size: 16px">{{r.title}}</span>
            <span style="font-size: 13px; color: #4A4E58">{{r.place}}</span>
          </span>
          <span aria-hidden="true" style="{{r.avatar}}">{{r.who}}</span>
        </a>
      </sc-for>
    </section>
  </div>

  <nav aria-label="Hauptnavigation" style="position: absolute; left: 50%; transform: translateX(-50%); bottom: 24px; height: 64px; border-radius: 32px; background: #FFFFFF; box-shadow: 0 12px 32px rgba(75,47,214,0.14); display: flex; align-items: center; gap: 6px; padding: 0 10px">
    <a href="HeuteV4.dc.html" aria-label="Heute" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4A4E58" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"></path></svg></a>
    <a href="KalenderV4.dc.html" aria-current="page" aria-label="Kalender" style="width: 48px; height: 48px; border-radius: 24px; background: #0D0E12; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg></a>
    <button type="button" aria-label="Neuer Termin" style="width: 48px; height: 48px; border: 0; border-radius: 24px; background: linear-gradient(140deg, #FFB98C, #B9A7EE); display: flex; align-items: center; justify-content: center; padding: 0">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0D0E12" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></button>
    <a href="GemeinsamV4.dc.html" aria-label="Gemeinsam" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4A4E58" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="4"></circle><path d="M2 21c0-4 3-6 7-6s7 2 7 6M16 4a4 4 0 0 1 0 8M22 21c0-3-2-5-4-6"></path></svg></a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { day: 13 };
  }
  renderVals() {
    const wds = ['Di', 'Mi', 'Do', 'Fr', 'Sa', 'So', 'Mo'];
    const busy = { 10: 1, 11: 0, 12: 3, 13: 5, 14: 2, 15: 2, 16: 1 };
    const days = [10, 11, 12, 13, 14, 15, 16].map((n, i) => {
      const sel = n === this.state.day;
      const dist = Math.abs(n - this.state.day);
      const size = sel ? 44 : dist === 1 ? 24 : 18;
      return {
        n: String(n), wd: wds[i], sel,
        label: wds[i] + ', ' + n + '. November' + (busy[n] ? ', ' + busy[n] + ' Termine' : ', frei'),
        num: "font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; line-height: 1; font-size: " + size + 'px; color: ' + (sel ? '#0D0E12' : dist === 1 ? '#4A4E58' : '#8A8F9A'),
        dot: 'width: 5px; height: 5px; border-radius: 3px; background: ' + (sel ? '#E0702F' : busy[n] ? '#A3A9B7' : 'transparent'),
        pick: () => this.setState({ day: n }),
      };
    });
    const card = (bg) => 'border-radius: 28px; padding: 16px 18px; display: flex; align-items: center; gap: 14px; background: ' + bg + '; box-shadow: 0 8px 24px rgba(13,14,18,0.05)';
    const av = (c) => 'width: 34px; height: 34px; border-radius: 17px; background: ' + c + '; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600';
    const data = {
      13: [
        ['08:30', 'bis 09:15', 'Zahnarzt', 'Praxis Dr. Sommer', 'Du', '#CDEFF6', 'linear-gradient(135deg, #FFFFFF 40%, #E3F6FA 100%)'],
        ['12:30', 'bis 13:30', 'Mittagessen mit Alex', 'Café Lindner', 'A', '#E4DAFB', '#FFFFFF'],
        ['17:45', 'bis 18:40', 'Friseur', 'Salon Schnittpunkt', 'Du', '#CDEFF6', '#FFFFFF'],
        ['19:00', 'bis 23:00', 'Spieleabend bei Olivia', 'Lindenstraße 8', 'O', '#E4DAFB', 'linear-gradient(135deg, #FFFFFF 40%, #EFE8FD 100%)'],
      ],
      14: [
        ['09:00', 'bis 10:00', 'Lauftreff', 'Stadtpark', 'D', '#FFE0C7', '#FFFFFF'],
        ['15:00', 'bis 16:00', 'Schwimmkurs', 'Hallenbad Mitte', 'L', '#FFE0C7', '#FFFFFF'],
      ],
    };
    const list = data[this.state.day] || [];
    return {
      days,
      dayTitle: (this.state.day === 13 ? 'Heute' : this.state.day + '. November'),
      count: list.length ? list.length + ' Termine' : '',
      empty: list.length === 0,
      items: list.map(([time, end, title, place, who, c, bg]) => ({ time, end, title, place, who, avatar: av(c), card: card(bg) })),
    };
  }
}
</script>
</body>
</html>
