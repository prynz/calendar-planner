<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Neuer Termin v6 – Konzept</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0D0E12;text-decoration:none}
a:hover{color:#2A2E38}
button{font:inherit;cursor:pointer}
input{font:inherit}
input::placeholder{color:#8A8F9A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(165deg, #FFD9BF 0%, #F6D7E3 50%, #E4DAFB 100%); font-family: Inter, system-ui, sans-serif; color: #0D0E12; position: relative; overflow: hidden">
  <div style="height: 844px; overflow-y: auto; box-sizing: border-box; display: flex; flex-direction: column">

    <div style="padding: 20px 24px 26px; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <a href="HeuteV6.dc.html" aria-label="Schließen" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,0.7); display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0D0E12" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
        <span style="font-size: 12px; font-weight: 600; color: #4B2FD6; background: rgba(255,255,255,0.7); padding: 4px 9px; border-radius: 999px">Demo</span>
      </div>
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 30px; letter-spacing: -0.5px">Neuer Termin</span>
    </div>

    <section aria-label="Details" style="position: relative; flex: 1; min-height: 700px">
      <svg aria-hidden="true" width="390" height="1000" viewBox="0 0 390 1000" style="position: absolute; top: 0; left: 0">
        <path d="M0 36 Q0 0 36 0 H196 C228 0 228 44 260 44 H354 Q390 44 390 80 V1000 H0 Z" fill="#FFFFFF"></path>
      </svg>
      <div style="position: relative; padding: 64px 24px 40px; display: flex; flex-direction: column; gap: 22px">

        <div role="tablist" aria-label="Bereich" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; background: #F3EFE8; border-radius: 22px; padding: 4px">
          <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
            <button type="button" role="tab" aria-selected="{{t.sel}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
          </sc-for>
        </div>

        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="neu-title" style="font-weight: 600; font-size: 15px">Was?</label>
          <input id="neu-title" type="text" placeholder="z. B. Zahnarzt" style="height: 52px; border: 0; border-bottom: 2px solid #EFE9DC; background: transparent; font-size: 18px; padding: 0; outline: none">
        </div>

        <div style="display: flex; flex-direction: column; gap: 8px">
          <span style="font-weight: 600; font-size: 15px">Wann?</span>
          <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; border-radius: 24px; background: linear-gradient(180deg, #FFFFFF 0%, #F6F1FF 50%, #FFFFFF 100%); padding: 6px 0">
            <sc-for list="{{wheels}}" as="w" hint-placeholder-count="4">
              <div role="group" aria-label="{{w.name}}" style="display: flex; flex-direction: column; align-items: center; gap: 2px">
                <span style="font-size: 11px; color: #5B5F69; padding-bottom: 4px">{{w.name}}</span>
                <button type="button" onClick="{{w.up}}" aria-label="{{w.upLabel}}" style="height: 30px; width: 56px; border: 0; background: transparent; font-size: 15px; color: #B8BCC6; padding: 0">{{w.prev}}</button>
                <span style="height: 44px; display: flex; align-items: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 26px">{{w.cur}}</span>
                <button type="button" onClick="{{w.down}}" aria-label="{{w.downLabel}}" style="height: 30px; width: 56px; border: 0; background: transparent; font-size: 15px; color: #B8BCC6; padding: 0">{{w.next}}</button>
              </div>
            </sc-for>
          </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="neu-place" style="font-weight: 600; font-size: 15px">Wo?</label>
          <input id="neu-place" type="text" placeholder="Adresse oder Ort" style="height: 52px; border: 0; border-bottom: 2px solid #EFE9DC; background: transparent; font-size: 18px; padding: 0; outline: none">
        </div>

        <div style="display: flex; align-items: center; gap: 12px; padding-top: 6px">
          <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
            <span style="font-weight: 600; font-size: 15px">Erinnern, wenn ich los muss</span>
            <span style="font-size: 13px; color: #5B5F69">mit Weg + Puffer</span>
          </span>
          <button type="button" role="switch" aria-checked="{{remind}}" aria-label="Erinnern, wenn ich los muss" onClick="{{toggleRemind}}" style="{{switchStyle}}">
            <span aria-hidden="true" style="{{knob}}"></span></button>
        </div>

        <button type="button" onClick="{{save}}" style="height: 60px; border: 0; border-radius: 30px; background: #C8F031; font-size: 17px; font-weight: 600; box-shadow: 0 10px 24px rgba(160,200,20,0.35)">{{saveLabel}}</button>
      </div>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'details', vals: [13, 10, 8, 30], remind: true, saved: false };
  }
  renderVals() {
    const months = ['Jan', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'];
    const defs = [
      { name: 'Tag', min: 1, max: 30, step: 1, fmt: (v) => String(v) },
      { name: 'Monat', min: 0, max: 11, step: 1, fmt: (v) => months[v] },
      { name: 'Stunde', min: 0, max: 23, step: 1, fmt: (v) => String(v).padStart(2, '0') },
      { name: 'Minute', min: 0, max: 55, step: 5, fmt: (v) => String(v).padStart(2, '0') },
    ];
    const wrap = (d, v) => (v > d.max ? d.min : v < d.min ? d.max - ((d.max - d.min) % d.step) : v);
    const set = (i, v) => { const vals = this.state.vals.slice(); vals[i] = v; this.setState({ vals, saved: false }); };
    const wheels = defs.map((d, i) => {
      const v = this.state.vals[i];
      const p = wrap(d, v - d.step);
      const n = wrap(d, v + d.step);
      return {
        name: d.name,
        prev: d.fmt(p), cur: d.fmt(v), next: d.fmt(n),
        upLabel: d.name + ' zurück: ' + d.fmt(p),
        downLabel: d.name + ' weiter: ' + d.fmt(n),
        up: () => set(i, p),
        down: () => set(i, n),
      };
    });
    const tabs = [['details', 'Details'], ['who', 'Wer'], ['remind', 'Erinnerung']].map(([k, label]) => {
      const sel = this.state.tab === k;
      return {
        label, sel,
        style: 'height: 40px; border: 0; border-radius: 18px; font-size: 14px; font-weight: 600; ' +
          (sel ? 'background: #0D0E12; color: #FFFFFF' : 'background: transparent; color: #5B5F69'),
        pick: () => this.setState({ tab: k }),
      };
    });
    const on = this.state.remind;
    return {
      tabs,
      wheels,
      remind: on,
      toggleRemind: () => this.setState({ remind: !on }),
      switchStyle: 'width: 56px; height: 34px; border: 0; border-radius: 17px; padding: 3px; display: flex; align-items: center; ' +
        (on ? 'background: #0D0E12; justify-content: flex-end' : 'background: #DDD5C4; justify-content: flex-start'),
      knob: 'width: 28px; height: 28px; border-radius: 14px; background: ' + (on ? '#C8F031' : '#FFFFFF'),
      saveLabel: this.state.saved ? 'Gespeichert (Demo)' : 'Speichern',
      save: () => this.setState({ saved: true }),
    };
  }
}
</script>
</body>
</html>
