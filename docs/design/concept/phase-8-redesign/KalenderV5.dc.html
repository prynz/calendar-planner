<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Kalender v5 – Konzept</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F4F5EF;text-decoration:none}
a:hover{color:#FFFFFF}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #141512; font-family: Inter, system-ui, sans-serif; color: #F4F5EF; position: relative; overflow: hidden">
  <div aria-hidden="true" style="position: absolute; top: 80px; right: -120px; width: 440px; height: 360px; border-radius: 50%; background: radial-gradient(closest-side, rgba(200,240,49,0.16) 0%, rgba(20,21,18,0) 100%)"></div>

  <div style="position: relative; height: 844px; overflow-y: auto; box-sizing: border-box; padding: 20px 24px 120px; display: flex; flex-direction: column; gap: 22px">

    <div style="display: flex; align-items: center; justify-content: space-between">
      <a href="HeuteV5.dc.html" aria-label="Zurück" style="width: 44px; height: 44px; border: 1px solid rgba(255,255,255,0.12); border-radius: 14px; background: rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F4F5EF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></a>
      <button type="button" aria-label="Monatsansicht" style="width: 44px; height: 44px; border: 1px solid rgba(255,255,255,0.12); border-radius: 14px; background: rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: center; padding: 0">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F4F5EF" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg></button>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: flex-start">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 30px; line-height: 34px; letter-spacing: -0.5px">Deine Woche</span>
        <span style="font-size: 13px; color: #A9AD9F">9. – 15. November</span>
      </div>
      <span style="display: flex; flex-direction: column; align-items: flex-end">
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 34px; line-height: 36px; color: #C8F031">{{selCount}}</span>
        <span style="font-size: 12px; color: #A9AD9F">Termine</span>
      </span>
    </div>

    <div style="position: relative; height: 170px">
      <svg role="img" aria-label="Wie voll die Woche ist: Freitag ist der vollste Tag" width="342" height="150" viewBox="0 0 342 150">
        <path d="M0 120 C 30 120, 35 95, 57 95 S 90 110, 114 100 S 150 40, 171 60 S 205 20, 228 18 S 262 80, 285 70 S 320 90, 342 85" fill="none" stroke="#C8F031" stroke-width="3" stroke-linecap="round"></path>
        <path d="M0 120 C 30 120, 35 95, 57 95 S 90 110, 114 100 S 150 40, 171 60 S 205 20, 228 18 S 262 80, 285 70 S 320 90, 342 85 L 342 150 L 0 150 Z" fill="rgba(200,240,49,0.08)"></path>
        <line x1="{{lineX}}" x2="{{lineX}}" y1="0" y2="150" stroke="rgba(255,255,255,0.25)" stroke-width="1" stroke-dasharray="3 4"></line>
      </svg>
      <div role="group" aria-label="Tag wählen" style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between">
        <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
          <button type="button" onClick="{{d.pick}}" aria-pressed="{{d.sel}}" aria-label="{{d.label}}" style="{{d.style}}">{{d.wd}}</button>
        </sc-for>
      </div>
    </div>

    <section aria-label="{{dayTitle}}" style="display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 14px; color: #A9AD9F">{{dayTitle}}</span>
      <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
        <span style="font-size: 15px; color: #A9AD9F">Frei – nichts geplant.</span>
      </sc-if>
      <sc-for list="{{items}}" as="r" hint-placeholder-count="4">
        <a href="TerminV5.dc.html" style="{{r.card}}">
          <span aria-hidden="true" style="{{r.icon}}">{{r.who}}</span>
          <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
            <span style="font-weight: 600; font-size: 16px">{{r.title}}</span>
            <span style="font-size: 13px; opacity: 0.75">{{r.time}}</span>
          </span>
          <span aria-hidden="true" style="{{r.arrow}}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg></span>
        </a>
      </sc-for>
    </section>
  </div>

  <nav aria-label="Hauptnavigation" style="position: absolute; left: 24px; right: 24px; bottom: 24px; height: 64px; border-radius: 22px; border: 1px solid rgba(255,255,255,0.10); background: rgba(34,35,31,0.92); display: flex; align-items: center; justify-content: space-around">
    <a href="HeuteV5.dc.html" aria-label="Heute" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A9AD9F" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"></path></svg></a>
    <a href="KalenderV5.dc.html" aria-current="page" aria-label="Kalender" style="width: 48px; height: 48px; border-radius: 16px; background: rgba(200,240,49,0.16); display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C8F031" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg></a>
    <button type="button" aria-label="Neuer Termin" style="width: 48px; height: 48px; border: 0; border-radius: 16px; background: rgba(255,255,255,0.10); display: flex; align-items: center; justify-content: center; padding: 0">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F4F5EF" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></button>
    <a href="GemeinsamV5.dc.html" aria-label="Gemeinsam" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A9AD9F" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="4"></circle><path d="M2 21c0-4 3-6 7-6s7 2 7 6M16 4a4 4 0 0 1 0 8M22 21c0-3-2-5-4-6"></path></svg></a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { day: 4 };
  }
  renderVals() {
    const wds = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
    const names = ['Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag', 'Sonntag'];
    const counts = [1, 1, 0, 3, 5, 2, 2];
    const days = wds.map((wd, i) => {
      const sel = i === this.state.day;
      return {
        wd, sel,
        label: names[i] + ', ' + (9 + i) + '. November, ' + counts[i] + ' Termine',
        style: 'width: 44px; height: 44px; border-radius: 14px; font-size: 13px; font-weight: 600; padding: 0; ' +
          (sel ? 'border: 0; background: #C8F031; color: #141512' : 'border: 1px solid rgba(255,255,255,0.10); background: rgba(255,255,255,0.05); color: #A9AD9F'),
        pick: () => this.setState({ day: i }),
      };
    });
    const data = {
      4: [['Zahnarzt', '08:30 – 09:15', 'Du'], ['Mittagessen mit Alex', '12:30 – 13:30', 'A'], ['Friseur', '17:45 – 18:40', 'Du'], ['Spieleabend bei Olivia', '19:00 – 23:00', 'O']],
      5: [['Lauftreff', '09:00 – 10:00', 'D'], ['Schwimmkurs Lena', '15:00 – 16:00', 'L']],
    };
    const list = data[this.state.day] || [];
    const items = list.map(([title, time, who], i) => {
      const active = this.state.day === 4 && i === 0;
      return {
        title, time, who,
        card: 'display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 22px; ' +
          (active ? 'background: #C8F031; color: #141512; box-shadow: 0 0 28px rgba(200,240,49,0.30)' : 'background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.10); color: #F4F5EF'),
        icon: 'width: 40px; height: 40px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; ' +
          (active ? 'background: rgba(20,21,18,0.12)' : 'background: rgba(255,255,255,0.08)'),
        arrow: 'width: 36px; height: 36px; border-radius: 12px; display: flex; align-items: center; justify-content: center; ' +
          (active ? 'background: #141512; color: #C8F031' : 'background: rgba(255,255,255,0.08); color: #F4F5EF'),
      };
    });
    return {
      days,
      lineX: 24 + this.state.day * (342 - 48) / 6,
      selCount: String(counts[this.state.day]),
      dayTitle: names[this.state.day] + ', ' + (9 + this.state.day) + '. November',
      empty: items.length === 0,
      items,
    };
  }
}
</script>
</body>
</html>
