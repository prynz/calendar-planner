<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Heute v6 – Konzept</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0D0E12;text-decoration:none}
a:hover{color:#2A2E38}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(165deg, #E4DAFB 0%, #F6D7E3 45%, #FFD9BF 100%); font-family: Inter, system-ui, sans-serif; color: #0D0E12; position: relative; overflow: hidden">
  <div style="height: 844px; overflow-y: auto; box-sizing: border-box; display: flex; flex-direction: column">

    <div style="padding: 20px 24px 28px; display: flex; flex-direction: column; gap: 18px">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <span style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 14px; color: #3A3550">Freitag, 13. Nov</span>
          <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 24px">Hallo, Kim</span>
        </span>
        <span style="display: flex; align-items: center; gap: 8px">
          <span style="font-size: 12px; font-weight: 600; color: #4B2FD6; background: rgba(255,255,255,0.7); padding: 4px 9px; border-radius: 999px">Demo</span>
          <a href="HeuteV6.dc.html" aria-label="Ich" style="width: 44px; height: 44px; border-radius: 22px; background: #0D0E12; display: flex; align-items: center; justify-content: center">
            <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 4-6 8-6s8 2 8 6"></path></svg></a>
        </span>
      </div>
      <div style="display: flex; align-items: flex-end; justify-content: space-between">
        <span style="display: flex; flex-direction: column">
          <span style="font-size: 14px; font-weight: 600; color: #3A3550">Zahnarzt 08:30 · los um</span>
          <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 80px; line-height: 80px; letter-spacing: -2px">07:55</span>
          <span style="font-size: 14px; color: #3A3550">in 25 Min. · 20 Min. Rad + 10 Puffer</span>
        </span>
        <button type="button" onClick="{{go}}" aria-label="{{goLabel}}" style="width: 68px; height: 68px; border: 0; border-radius: 34px; background: #C8F031; display: flex; align-items: center; justify-content: center; padding: 0; box-shadow: 0 10px 24px rgba(120,150,10,0.35)">
          <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0D0E12" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
      </div>
    </div>

    <section aria-label="Heute" style="position: relative; flex: 1; min-height: 600px">
      <svg aria-hidden="true" width="390" height="1000" viewBox="0 0 390 1000" style="position: absolute; top: 0; left: 0">
        <path d="M0 36 Q0 0 36 0 H150 C182 0 182 48 214 48 H354 Q390 48 390 84 V1000 H0 Z" fill="#FFFFFF"></path>
      </svg>
      <div style="position: relative; padding: 0 24px 120px; display: flex; flex-direction: column">
        <div style="height: 48px; display: flex; align-items: center; justify-content: space-between">
          <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 22px">Heute</span>
          <span style="font-size: 14px; font-weight: 600; color: #3A3550; padding-top: 34px">6 Termine</span>
        </div>
        <div style="display: flex; flex-direction: column; padding-top: 22px">
          <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
            <div style="display: flex; gap: 14px">
              <span aria-hidden="true" style="width: 16px; display: flex; flex-direction: column; align-items: center">
                <span style="{{r.dot}}"></span>
                <span style="{{r.line}}"></span>
              </span>
              <sc-if value="{{r.plain}}" hint-placeholder-val="{{ true }}">
                <div style="flex: 1; display: flex; justify-content: space-between; gap: 12px; padding-bottom: 22px">
                  <span style="display: flex; flex-direction: column; gap: 2px">
                    <span style="font-weight: 600; font-size: 16px; color: {{r.color}}">{{r.title}}</span>
                    <span style="font-size: 13px; color: #5B5F69">{{r.sub}}</span>
                  </span>
                  <span style="font-size: 14px; font-weight: 600; color: {{r.color}}">{{r.time}}</span>
                </div>
              </sc-if>
              <sc-if value="{{r.focus}}" hint-placeholder-val="{{ false }}">
                <div style="flex: 1; margin-bottom: 22px; border-radius: 24px; background: linear-gradient(140deg, #EFE8FD, #FFF0E4); padding: 16px; display: flex; flex-direction: column; gap: 4px">
                  <span style="font-size: 12px; font-weight: 600; color: #4B2FD6">Als Nächstes</span>
                  <span style="display: flex; justify-content: space-between"><span style="font-weight: 700; font-size: 17px">{{r.title}}</span><span style="font-weight: 700; font-size: 15px">{{r.time}}</span></span>
                  <span style="font-size: 13px; color: #3A3550">{{r.sub}}</span>
                </div>
              </sc-if>
            </div>
          </sc-for>
        </div>
      </div>
    </section>
  </div>

  <nav aria-label="Hauptnavigation" style="position: absolute; left: 50%; transform: translateX(-50%); bottom: 24px; height: 64px; border-radius: 32px; background: #0D0E12; box-shadow: 0 12px 32px rgba(13,14,18,0.25); display: flex; align-items: center; gap: 6px; padding: 0 10px">
    <a href="HeuteV6.dc.html" aria-current="page" aria-label="Heute" style="width: 48px; height: 48px; border-radius: 24px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0D0E12" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"></path></svg></a>
    <a href="KalenderV6.dc.html" aria-label="Kalender" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C9CCD3" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg></a>
    <a href="NeuV6.dc.html" aria-label="Neuer Termin" style="width: 48px; height: 48px; border-radius: 24px; background: linear-gradient(140deg, #FFB98C, #B9A7EE); display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0D0E12" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></a>
    <a href="GemeinsamV4.dc.html" aria-label="Gemeinsam" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C9CCD3" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="4"></circle><path d="M2 21c0-4 3-6 7-6s7 2 7 6M16 4a4 4 0 0 1 0 8M22 21c0-3-2-5-4-6"></path></svg></a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { going: false };
  }
  renderVals() {
    const items = [
      ['Physio', 'im Zentrum', '07:00', 'past'],
      ['Zahnarzt', 'Praxis Dr. Sommer · 20 Min. Rad', '08:30', 'next'],
      ['Mittagessen mit Alex', 'Café Lindner', '12:30', ''],
      ['Grillen', 'Familie', '16:00', ''],
      ['Friseur', 'Salon Schnittpunkt', '17:45', ''],
      ['Spieleabend bei Olivia', 'knapp nach Physio', '19:00', ''],
    ];
    const rows = items.map(([title, sub, time, kind], i) => {
      const last = i === items.length - 1;
      return {
        title, sub, time,
        plain: kind !== 'next',
        focus: kind === 'next',
        color: kind === 'past' ? '#8A8F9A' : '#0D0E12',
        dot: 'width: 12px; height: 12px; border-radius: 6px; box-sizing: border-box; margin-top: 4px; flex-shrink: 0; ' +
          (kind === 'next' ? 'background: #C8F031; border: 3px solid #0D0E12' : kind === 'past' ? 'background: #C9CCD3' : 'background: #FFFFFF; border: 2px solid #0D0E12'),
        line: 'flex: 1; width: 2px; margin: 4px 0; background: ' + (last ? 'transparent' : '#EFE9DC'),
      };
    });
    return {
      rows,
      goLabel: this.state.going ? 'Unterwegs – zurücknehmen' : 'Bin unterwegs',
      go: () => this.setState({ going: !this.state.going }),
    };
  }
}
</script>
</body>
</html>
