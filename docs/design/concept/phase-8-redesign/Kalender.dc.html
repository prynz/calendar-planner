<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Kalender – Konzept</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0D0E12;text-decoration:none}
a:hover{color:#2A2E38}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F3EA; font-family: Inter, system-ui, sans-serif; color: #0D0E12; position: relative; overflow: hidden">
  <div style="height: 844px; overflow-y: auto; box-sizing: border-box; padding: 18px 20px 120px; display: flex; flex-direction: column; gap: 16px">

    <div style="display: flex; align-items: center; justify-content: space-between">
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 30px; letter-spacing: -0.5px">November</span>
      <div style="display: flex; gap: 8px">
        <button type="button" aria-label="Voriger Monat" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0D0E12" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></button>
        <button type="button" aria-label="Nächster Monat" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0D0E12" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg></button>
      </div>
    </div>

    <div role="group" aria-label="Wessen Termine" style="display: flex; gap: 8px; overflow-x: auto">
      <sc-for list="{{people}}" as="p" hint-placeholder-count="5">
        <button type="button" onClick="{{p.pick}}" aria-pressed="{{p.pressed}}" style="{{p.style}}">
          <span aria-hidden="true" style="{{p.dot}}"></span>{{p.name}}</button>
      </sc-for>
    </div>

    <div style="background: #FFFFFF; border-radius: 28px; padding: 14px 10px; display: flex; flex-direction: column; gap: 4px">
      <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); text-align: center; font-size: 12px; font-weight: 600; color: #5B5F69; padding-bottom: 4px">
        <span>Mo</span><span>Di</span><span>Mi</span><span>Do</span><span>Fr</span><span>Sa</span><span>So</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: 2px">
        <sc-for list="{{cells}}" as="c" hint-placeholder-count="42">
          <button type="button" onClick="{{c.pick}}" aria-label="{{c.label}}" style="{{c.style}}">
            <span>{{c.n}}</span>
            <span aria-hidden="true" style="display: flex; gap: 3px; height: 6px">
              <sc-for list="{{c.dots}}" as="dot" hint-placeholder-count="2">
                <span style="{{dot.style}}"></span>
              </sc-for>
            </span>
          </button>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 20px">{{dayTitle}}</span>
      <span style="font-size: 13px; color: #5B5F69">{{dayCount}}</span>
    </div>

    <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
      <div style="background: #EFE9DC; border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start">
        <span style="font-size: 15px">Frei – nichts geplant für diese Auswahl.</span>
        <button type="button" style="height: 44px; padding: 0 18px; border: 0; border-radius: 22px; background: #0D0E12; color: #F7F3EA; font-weight: 600">Termin eintragen</button>
      </div>
    </sc-if>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{agenda}}" as="e" hint-placeholder-count="3">
        <a href="Termin.dc.html" style="{{e.card}}">
          <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
            <span style="font-weight: 600; font-size: 16px">{{e.title}}</span>
            <span style="font-size: 13px; color: #2A2E38">{{e.sub}}</span>
          </div>
          <div aria-hidden="true" style="width: 34px; height: 34px; border-radius: 17px; background: rgba(255,255,255,0.7); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; flex-shrink: 0">{{e.who}}</div>
        </a>
      </sc-for>
    </div>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 22px; display: flex; gap: 10px; align-items: center">
    <nav aria-label="Hauptnavigation" style="flex: 1; height: 64px; border-radius: 32px; background: #0D0E12; display: flex; align-items: center; justify-content: space-between; padding: 0 8px">
      <a href="Main.dc.html" aria-label="Heute" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #A3A9B7">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></a>
      <a href="Kalender.dc.html" aria-current="page" style="height: 48px; padding: 0 16px; border-radius: 24px; background: #C8F031; color: #0D0E12; display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 14px">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Kalender</a>
      <a href="Termin.dc.html" aria-label="Gemeinsam" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #A3A9B7">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"></path><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c1.8.7 3 2.5 3.5 5.2"></path></svg></a>
      <a href="Personalisieren.dc.html" aria-label="Ich" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #A3A9B7">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1-4 4.2-6 8-6s7 2 8 6"></path></svg></a>
    </nav>
    <button type="button" aria-label="Neuer Termin" style="width: 64px; height: 64px; border: 0; border-radius: 32px; background: #C8F031; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0D0E12" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { person: 'all', day: 12 };
  }
  renderVals() {
    const colors = { me: '#D3C6EE', sam: '#BDEBC8', lena: '#FFCFAE', family: '#8EDBEA' };
    const events = [
      { day: 9, who: 'me', title: 'Teammeeting', sub: '09:00 – 10:00 · Büro' },
      { day: 12, who: 'me', title: 'Zahnarzt', sub: '11:00 – 12:00 · Praxis am Markt' },
      { day: 12, who: 'me', title: 'Mittagessen mit Alex', sub: '12:30 – 13:30 · Café Lindner' },
      { day: 12, who: 'sam', title: 'Schwimmen', sub: '15:30 – 16:30 · Hallenbad Nord · Fahrt offen' },
      { day: 12, who: 'me', title: 'Spieleabend bei Olivia', sub: '19:00 – 23:00' },
      { day: 13, who: 'lena', title: 'Flötenunterricht', sub: '16:00 – 16:45 · Musikschule' },
      { day: 14, who: 'family', title: 'Familienbrunch', sub: '10:30 – 13:00 · bei Oma' },
      { day: 14, who: 'sam', title: 'Fußballturnier', sub: '09:00 – 12:00 · Sportplatz' },
      { day: 17, who: 'me', title: 'Grillabend am See', sub: '16:00 – 21:00 · Badestelle Ost' },
      { day: 20, who: 'lena', title: 'Kindergeburtstag Mia', sub: '14:00 – 17:00' },
      { day: 26, who: 'family', title: 'Elternabend', sub: '19:30 – 21:00 · Schule' },
    ];
    const person = this.state.person;
    const visible = events.filter((e) => person === 'all' || e.who === person);
    const peopleDef = [['all', 'Alle', '#0D0E12'], ['me', 'Du', colors.me], ['sam', 'Sam', colors.sam], ['lena', 'Lena', colors.lena], ['family', 'Familie', colors.family]];
    const people = peopleDef.map(([id, name, c]) => {
      const sel = person === id;
      return {
        name,
        pressed: sel ? 'true' : 'false',
        pick: () => this.setState({ person: id }),
        style: 'flex-shrink: 0; height: 40px; padding: 0 14px; border-radius: 20px; display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; border: 1.5px solid ' + (sel ? '#0D0E12' : 'transparent') + '; background: ' + (sel ? '#0D0E12' : '#FFFFFF') + '; color: ' + (sel ? '#F7F3EA' : '#0D0E12'),
        dot: 'width: 10px; height: 10px; border-radius: 5px; background: ' + c + (id === 'all' ? '; display: none' : ''),
      };
    });
    const cells = [];
    for (let i = 0; i < 42; i++) {
      const n = i - 5;
      if (n < 1 || n > 30) {
        cells.push({ n: '', label: 'leer', dots: [], pick: () => {}, style: 'height: 48px; border: 0; background: transparent' });
        continue;
      }
      const dayEvents = visible.filter((e) => e.day === n);
      const sel = this.state.day === n;
      const today = n === 12;
      cells.push({
        n,
        label: n + '. November, ' + (dayEvents.length === 0 ? 'keine Termine' : dayEvents.length + (dayEvents.length === 1 ? ' Termin' : ' Termine')),
        pick: () => this.setState({ day: n }),
        dots: dayEvents.slice(0, 3).map((e) => ({ style: 'width: 6px; height: 6px; border-radius: 3px; background: ' + (sel ? '#F7F3EA' : colors[e.who]) })),
        style: 'height: 48px; border: ' + (today && !sel ? '1.5px solid #0D0E12' : '0') + '; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-weight: 600; font-size: 15px; padding: 0; background: ' + (sel ? '#0D0E12' : 'transparent') + '; color: ' + (sel ? '#F7F3EA' : '#0D0E12'),
      });
    }
    const dayList = visible.filter((e) => e.day === this.state.day);
    const names = { me: 'D', sam: 'S', lena: 'L', family: 'F' };
    const wd = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'][(this.state.day - 1) % 7];
    return {
      people,
      cells,
      dayTitle: (this.state.day === 12 ? 'Heute · ' : '') + wd + ', ' + this.state.day + '. November',
      dayCount: dayList.length === 1 ? '1 Termin' : dayList.length + ' Termine',
      empty: dayList.length === 0,
      agenda: dayList.map((e) => ({
        title: e.title,
        sub: e.sub,
        who: names[e.who],
        card: 'background: ' + colors[e.who] + '; border-radius: 22px; padding: 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; color: #0D0E12',
      })),
    };
  }
}
</script>
</body>
</html>
