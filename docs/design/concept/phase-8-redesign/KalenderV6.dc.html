<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Kalender v6 – Konzept</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0D0E12;text-decoration:none}
a:hover{color:#2A2E38}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(170deg, #FFFFFF 0%, #F6EFFF 60%, #FFE8D9 100%); font-family: Inter, system-ui, sans-serif; color: #0D0E12; position: relative; overflow: hidden">
  <div style="height: 844px; overflow-y: auto; box-sizing: border-box; display: flex; flex-direction: column">

    <div style="padding: 20px 0 30px; display: flex; flex-direction: column; gap: 18px">
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 24px">
        <a href="HeuteV6.dc.html" aria-label="Zurück" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; margin-left: -10px">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0D0E12" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></a>
        <button type="button" aria-label="Wessen Termine: alle" style="height: 40px; border: 0; border-radius: 20px; background: rgba(255,255,255,0.8); padding: 0 14px; font-size: 14px; font-weight: 600">Alle</button>
      </div>
      <div role="group" aria-label="Monat" style="display: flex; align-items: baseline; justify-content: center; gap: 22px; overflow: hidden">
        <button type="button" onClick="{{prev}}" style="border: 0; background: transparent; padding: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 22px; color: #B8BCC6">{{prevName}}</button>
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 34px">{{monthName}}</span>
        <button type="button" onClick="{{next}}" style="border: 0; background: transparent; padding: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 22px; color: #B8BCC6">{{nextName}}</button>
      </div>
      <div role="group" aria-label="Tag wählen" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); padding: 0 16px">
        <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
          <button type="button" onClick="{{d.pick}}" aria-pressed="{{d.sel}}" aria-label="{{d.label}}" style="{{d.style}}">
            <span style="font-size: 12px; opacity: 0.7">{{d.wd}}</span>
            <span style="font-size: 16px; font-weight: 700">{{d.n}}</span>
          </button>
        </sc-for>
      </div>
    </div>

    <section aria-label="{{dayTitle}}" style="position: relative; flex: 1; min-height: 560px">
      <svg aria-hidden="true" width="390" height="1000" viewBox="0 0 390 1000" style="position: absolute; top: 0; left: 0">
        <path d="M0 84 Q0 48 36 48 H176 C208 48 208 0 240 0 H354 Q390 0 390 36 V1000 H0 Z" fill="#0D0E12"></path>
      </svg>
      <div style="position: relative; padding: 0 24px 120px; display: flex; flex-direction: column; color: #F4F5EF">
        <div style="height: 48px; display: flex; align-items: center; justify-content: flex-end">
          <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 20px; color: #FFFFFF">{{dayTitle}}</span>
        </div>
        <div style="display: flex; flex-direction: column; padding-top: 26px">
          <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
            <span style="font-size: 15px; color: #B8BCC6">Frei – nichts geplant.</span>
          </sc-if>
          <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
            <div style="display: flex; gap: 14px">
              <span aria-hidden="true" style="width: 16px; display: flex; flex-direction: column; align-items: center">
                <span style="{{r.dot}}"></span>
                <span style="{{r.line}}"></span>
              </span>
              <sc-if value="{{r.plain}}" hint-placeholder-val="{{ true }}">
                <a href="TerminV4.dc.html" style="flex: 1; display: flex; justify-content: space-between; gap: 12px; padding-bottom: 24px; color: #FFFFFF">
                  <span style="display: flex; flex-direction: column; gap: 2px">
                    <span style="font-weight: 600; font-size: 16px">{{r.title}}</span>
                    <span style="font-size: 13px; color: #B8BCC6">{{r.sub}}</span>
                  </span>
                  <span style="font-size: 14px; font-weight: 600">{{r.time}}</span>
                </a>
              </sc-if>
              <sc-if value="{{r.focus}}" hint-placeholder-val="{{ false }}">
                <a href="TerminV4.dc.html" style="flex: 1; margin-bottom: 24px; border-radius: 22px; background: linear-gradient(140deg, #EFE8FD, #FFE3CF); color: #0D0E12; padding: 16px; display: flex; flex-direction: column; gap: 4px">
                  <span style="font-size: 12px; font-weight: 600; color: #4B2FD6">Als Nächstes</span>
                  <span style="display: flex; justify-content: space-between"><span style="font-weight: 700; font-size: 17px">{{r.title}}</span><span style="font-weight: 700; font-size: 15px">{{r.time}}</span></span>
                  <span style="font-size: 13px; color: #3A3550">{{r.sub}}</span>
                </a>
              </sc-if>
            </div>
          </sc-for>
        </div>
      </div>
    </section>
  </div>

  <nav aria-label="Hauptnavigation" style="position: absolute; left: 50%; transform: translateX(-50%); bottom: 24px; height: 64px; border-radius: 32px; background: #FFFFFF; box-shadow: 0 12px 32px rgba(0,0,0,0.35); display: flex; align-items: center; gap: 6px; padding: 0 10px">
    <a href="HeuteV6.dc.html" aria-label="Heute" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4A4E58" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"></path></svg></a>
    <a href="KalenderV6.dc.html" aria-current="page" aria-label="Kalender" style="width: 48px; height: 48px; border-radius: 24px; background: #0D0E12; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg></a>
    <a href="NeuV6.dc.html" aria-label="Neuer Termin" style="width: 48px; height: 48px; border-radius: 24px; background: linear-gradient(140deg, #FFB98C, #B9A7EE); display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0D0E12" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></a>
    <a href="GemeinsamV4.dc.html" aria-label="Gemeinsam" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4A4E58" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="4"></circle><path d="M2 21c0-4 3-6 7-6s7 2 7 6M16 4a4 4 0 0 1 0 8M22 21c0-3-2-5-4-6"></path></svg></a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { day: 13, month: 10 };
  }
  renderVals() {
    const months = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
    const m = this.state.month;
    const wds = ['Di', 'Mi', 'Do', 'Fr', 'Sa', 'So', 'Mo'];
    const days = [10, 11, 12, 13, 14, 15, 16].map((n, i) => {
      const sel = n === this.state.day;
      return {
        n: String(n), wd: wds[i], sel,
        label: wds[i] + ', ' + n + '. ' + months[m],
        style: 'height: 72px; border: 0; border-radius: 22px; padding: 0; margin: 0 3px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; ' +
          (sel ? 'background: #0D0E12; color: #FFFFFF' : 'background: transparent; color: #0D0E12'),
        pick: () => this.setState({ day: n }),
      };
    });
    const data = {
      13: [
        ['Zahnarzt', 'Praxis Dr. Sommer · los 07:55', '08:30', true],
        ['Mittagessen mit Alex', 'Café Lindner', '12:30', false],
        ['Friseur', 'Salon Schnittpunkt', '17:45', false],
        ['Spieleabend bei Olivia', 'Lindenstraße 8', '19:00', false],
      ],
      14: [['Lauftreff', 'Stadtpark', '09:00', true], ['Schwimmkurs Lena', 'Hallenbad Mitte', '15:00', false]],
    };
    const list = data[this.state.day] || [];
    const rows = list.map(([title, sub, time, focus], i) => ({
      title, sub, time,
      focus, plain: !focus,
      dot: 'width: 12px; height: 12px; border-radius: 6px; box-sizing: border-box; margin-top: 4px; flex-shrink: 0; ' +
        (focus ? 'background: #C8F031' : 'border: 2px solid #FFFFFF'),
      line: 'flex: 1; width: 2px; margin: 4px 0; background: ' + (i === list.length - 1 ? 'transparent' : 'rgba(255,255,255,0.18)'),
    }));
    return {
      monthName: months[m],
      prevName: months[(m + 11) % 12],
      nextName: months[(m + 1) % 12],
      prev: () => this.setState({ month: (m + 11) % 12 }),
      next: () => this.setState({ month: (m + 1) % 12 }),
      days,
      dayTitle: this.state.day === 13 ? 'Heute' : this.state.day + '. ' + months[m],
      empty: rows.length === 0,
      rows,
    };
  }
}
</script>
</body>
</html>
