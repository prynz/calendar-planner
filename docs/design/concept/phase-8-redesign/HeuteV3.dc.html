<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Heute v3 – Konzept</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0D0E12;text-decoration:none}
a:hover{color:#2A2E38}
button{font:inherit;cursor:pointer}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
.sheet{animation:sheetUp 300ms cubic-bezier(.2,.9,.3,1)}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF9F4; font-family: Inter, system-ui, sans-serif; color: #0D0E12; position: relative; overflow: hidden">
  <div style="height: 844px; overflow-y: auto; box-sizing: border-box; padding: 24px 24px 120px; display: flex; flex-direction: column; gap: 32px">

    <div style="display: flex; align-items: flex-end; justify-content: space-between">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 14px; color: #5B5F69">Freitag, 13. November</span>
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 30px; letter-spacing: -0.5px">Heute</span>
      </div>
      <span style="font-size: 12px; font-weight: 600; color: #4B2FD6; border: 1px solid #C9C0F2; padding: 3px 8px; border-radius: 999px">Demo</span>
    </div>

    <section aria-label="Als Nächstes" style="background: #FFFFFF; border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 8px 28px rgba(13,14,18,0.06)">
      <span style="font-size: 13px; font-weight: 600; color: #5B5F69">Als Nächstes · Zahnarzt 08:30</span>
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 44px; line-height: 48px; letter-spacing: -1px">07:55 los</span>
      <span style="font-size: 14px; color: #5B5F69">in 25 Min. · 20 Min. Rad + 10 Min. Puffer</span>
      <div style="display: flex; gap: 10px; margin-top: 12px">
        <button type="button" style="flex: 1; height: 52px; border: 0; border-radius: 26px; background: #C8F031; color: #0D0E12; font-weight: 600; font-size: 16px">Bin unterwegs</button>
        <button type="button" onClick="{{openMore}}" aria-label="Mehr: Ich verspäte mich, Bereit-Check" style="width: 52px; height: 52px; border: 0; border-radius: 26px; background: #F1ECE2; display: flex; align-items: center; justify-content: center; padding: 0">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="#0D0E12"><circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle></svg></button>
      </div>
    </section>

    <sc-if value="{{helperOpen}}" hint-placeholder-val="{{ true }}">
      <button type="button" onClick="{{closeHelper}}" style="border: 0; background: transparent; padding: 0; display: flex; align-items: center; gap: 10px; text-align: start">
        <span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 4px; background: #F08A4B; flex-shrink: 0"></span>
        <span style="flex: 1; font-size: 15px">Spieleabend → Physio wird knapp</span>
        <span style="font-size: 15px; font-weight: 600; text-decoration: underline">Lösen</span>
      </button>
    </sc-if>

    <section aria-label="Dein Tag" style="display: flex; flex-direction: column">
      <div style="display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 6px">
        <span style="font-weight: 600; font-size: 17px">Dein Tag</span>
        <span style="font-size: 14px; color: #5B5F69">6 Termine</span>
      </div>
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
        <sc-if value="{{r.gap}}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; align-items: center; gap: 12px; height: 40px">
            <span style="width: 48px"></span>
            <span aria-hidden="true" style="flex: 1; border-top: 1.5px dashed #DDD5C4"></span>
            <span style="font-size: 13px; color: #5B5F69">{{r.title}}</span>
          </div>
        </sc-if>
        <sc-if value="{{r.item}}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; align-items: center; gap: 12px; min-height: 56px; border-bottom: 1px solid #EFE9DC">
            <span style="width: 48px; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; color: {{r.timeColor}}">{{r.time}}</span>
            <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 16px; color: {{r.titleColor}}; text-decoration: {{r.strike}}">{{r.title}}</span>
              <sc-if value="{{r.hasNote}}" hint-placeholder-val="{{ false }}"><span style="font-size: 13px; color: #B4471F">{{r.note}}</span></sc-if>
            </span>
            <button type="button" onClick="{{r.toggle}}" aria-pressed="{{r.done}}" aria-label="{{r.label}}" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; padding: 0">
              <span aria-hidden="true" style="{{r.box}}">
                <sc-if value="{{r.done}}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></sc-if>
              </span></button>
          </div>
        </sc-if>
      </sc-for>
      <a href="KalenderV3.dc.html" style="display: flex; justify-content: space-between; align-items: center; height: 52px; font-size: 15px; color: #5B5F69">
        <span>Morgen · 3 Termine</span>
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5B5F69" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg></a>
    </section>
  </div>

  <nav aria-label="Hauptnavigation" style="position: absolute; left: 20px; right: 20px; bottom: 24px; display: flex; gap: 10px; align-items: center">
    <div style="flex: 1; height: 60px; border-radius: 30px; background: #FFFFFF; box-shadow: 0 8px 28px rgba(13,14,18,0.10); display: flex; align-items: center; justify-content: space-around; padding: 0 8px">
      <a href="HeuteV3.dc.html" aria-current="page" style="display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 14px; border-radius: 22px; background: #0D0E12; color: #FFFFFF; font-size: 14px; font-weight: 600">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"></path></svg>Heute</a>
      <a href="KalenderV3.dc.html" aria-label="Kalender" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5B5F69" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg></a>
      <a href="GemeinsamV3.dc.html" aria-label="Gemeinsam" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5B5F69" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="4"></circle><path d="M2 21c0-4 3-6 7-6s7 2 7 6M16 4a4 4 0 0 1 0 8M22 21c0-3-2-5-4-6"></path></svg></a>
      <a href="HeuteV3.dc.html" aria-label="Ich" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5B5F69" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 4-6 8-6s8 2 8 6"></path></svg></a>
    </div>
    <button type="button" aria-label="Neuer Termin" style="width: 60px; height: 60px; border: 0; border-radius: 30px; background: #0D0E12; display: flex; align-items: center; justify-content: center; padding: 0; box-shadow: 0 8px 28px rgba(13,14,18,0.18)">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></button>
  </nav>

  <sc-if value="{{moreOpen}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; background: rgba(13,14,18,0.35); display: flex; flex-direction: column; justify-content: flex-end">
      <button type="button" onClick="{{closeMore}}" aria-label="Schließen" style="flex: 1; border: 0; background: transparent"></button>
      <div class="sheet" role="dialog" aria-label="Mehr zu Zahnarzt" style="background: #FFFFFF; border-radius: 28px 28px 0 0; padding: 12px 24px 36px; display: flex; flex-direction: column">
        <span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #DDD5C4; margin-bottom: 12px"></span>
        <sc-for list="{{moreItems}}" as="m" hint-placeholder-count="3">
          <button type="button" onClick="{{closeMore}}" style="height: 56px; border: 0; border-bottom: 1px solid #EFE9DC; background: transparent; text-align: start; font-size: 16px; display: flex; justify-content: space-between; align-items: center; padding: 0">
            <span>{{m.label}}</span><span style="font-size: 14px; color: #5B5F69">{{m.hint}}</span></button>
        </sc-for>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { done: { dentist: false }, more: false, helper: true };
  }
  renderVals() {
    const items = [
      { id: 'physio', time: '07:00', title: 'Physio', past: true },
      { id: 'dentist', time: '08:30', title: 'Zahnarzt', next: true },
      { id: 'lunch', time: '12:30', title: 'Mittagessen mit Alex' },
      { gap: true, title: '3 Std. frei' },
      { id: 'grill', time: '16:00', title: 'Grillen' },
      { id: 'hair', time: '17:45', title: 'Friseur' },
      { id: 'games', time: '19:00', title: 'Spieleabend bei Olivia', note: 'knapp nach Physio' },
    ];
    const rows = items.map((it) => {
      if (it.gap) return { gap: true, item: false, title: it.title };
      const done = Boolean(this.state.done[it.id]) || Boolean(it.past);
      return {
        gap: false,
        item: true,
        time: it.time,
        title: it.title,
        done,
        hasNote: Boolean(it.note),
        note: it.note || '',
        timeColor: done ? '#A3A9B7' : '#0D0E12',
        titleColor: done ? '#5B5F69' : '#0D0E12',
        strike: done ? 'line-through' : 'none',
        label: (done ? 'Wieder offen: ' : 'Abhaken: ') + it.title,
        box: 'width: 22px; height: 22px; border-radius: 11px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; ' +
          (done ? 'background: #0D0E12; border: 0' : 'border: 2px solid #A3A9B7'),
        toggle: () => this.setState({ done: { ...this.state.done, [it.id]: !this.state.done[it.id] } }),
      };
    });
    return {
      rows,
      helperOpen: this.state.helper,
      closeHelper: () => this.setState({ helper: false }),
      moreOpen: this.state.more,
      openMore: () => this.setState({ more: true }),
      closeMore: () => this.setState({ more: false }),
      moreItems: [
        { label: 'Ich verspäte mich', hint: 'Bescheid geben' },
        { label: 'Bereit-Check', hint: '0 von 3' },
        { label: 'Termin öffnen', hint: '' },
      ],
    };
  }
}
</script>
</body>
</html>
