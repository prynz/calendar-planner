<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Termin v4 – Konzept</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0D0E12;text-decoration:none}
a:hover{color:#2A2E38}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF8F4; font-family: Inter, system-ui, sans-serif; color: #0D0E12; position: relative; overflow: hidden">
  <div aria-hidden="true" style="position: absolute; top: 0; left: 0; right: 0; height: 420px; background: linear-gradient(170deg, #FFC9A6 0%, #F6C9DA 45%, #E4DAFB 100%); border-radius: 0 0 48px 48px"></div>

  <div style="position: relative; height: 844px; overflow-y: auto; box-sizing: border-box; padding: 20px 24px 140px; display: flex; flex-direction: column; gap: 20px">

    <div style="display: flex; justify-content: space-between; align-items: center">
      <a href="HeuteV4.dc.html" aria-label="Zurück" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,0.75); display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0D0E12" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></a>
      <span style="font-size: 12px; font-weight: 600; color: #4B2FD6; background: rgba(255,255,255,0.75); padding: 4px 9px; border-radius: 999px">Demo</span>
      <button type="button" aria-label="Mehr: Bearbeiten, Teilen, Löschen" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: rgba(255,255,255,0.75); display: flex; align-items: center; justify-content: center; padding: 0">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="#0D0E12"><circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle></svg></button>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 4px">
      <span style="font-size: 14px; font-weight: 600; color: #3A2E3A">Freitag, 13. Nov · 19:00</span>
      <span style="font-size: 13px; color: #3A2E3A">Lindenstraße 8</span>
    </div>

    <div style="position: relative; height: 290px">
      <div aria-hidden="true" style="position: absolute; left: 30px; right: 30px; top: 0; height: 260px; border-radius: 32px; background: rgba(255,255,255,0.5); transform: rotate(-3deg)"></div>
      <section aria-label="Spieleabend bei Olivia" style="position: absolute; left: 0; right: 0; top: 18px; height: 262px; box-sizing: border-box; border-radius: 32px; background: #FFFFFF; padding: 22px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 24px 56px rgba(120,60,90,0.18)">
        <div style="display: flex; align-items: center; gap: 10px">
          <span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 16px; background: #E4DAFB; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px">O</span>
          <span style="font-size: 14px; color: #4A4E58">Olivia lädt ein</span>
        </div>
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 32px; line-height: 36px; letter-spacing: -0.5px">Spieleabend bei Olivia</span>
        <div style="flex: 1"></div>
        <div style="display: flex; gap: 8px">
          <sc-for list="{{chips}}" as="c" hint-placeholder-count="3">
            <button type="button" style="height: 40px; border: 0; border-radius: 20px; background: #F3EFE8; padding: 0 12px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px">{{c.label}}<span style="color: #4A4E58; font-weight: 500">{{c.value}}</span></button>
          </sc-for>
        </div>
      </section>
    </div>

    <div role="radiogroup" aria-label="Deine Antwort" style="display: flex; justify-content: center; gap: 14px">
      <sc-for list="{{answers}}" as="a" hint-placeholder-count="3">
        <button type="button" role="radio" aria-checked="{{a.sel}}" onClick="{{a.pick}}" aria-label="{{a.label}}" style="border: 0; background: transparent; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 6px">
          <span aria-hidden="true" style="{{a.circle}}">{{a.sign}}</span>
          <span style="font-size: 13px; font-weight: 600; color: {{a.color}}">{{a.label}}</span>
        </button>
      </sc-for>
    </div>

    <button type="button" style="border: 0; background: transparent; padding: 0; font-size: 15px; font-weight: 600; text-decoration: underline; align-self: center">+ Umfrage oder Kosten</button>
  </div>

  <div style="position: absolute; left: 24px; right: 24px; bottom: 28px; height: 76px; border-radius: 38px; background: #FFFFFF; box-shadow: 0 14px 36px rgba(13,14,18,0.12); display: flex; align-items: center; padding: 0 10px 0 24px; gap: 12px">
    <span style="flex: 1; display: flex; flex-direction: column">
      <span style="font-size: 12px; color: #4A4E58">Losgehen · 22 Min. Rad + 10 Puffer</span>
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 28px; line-height: 32px">18:28</span>
    </span>
    <button type="button" aria-label="Bereit-Check öffnen" style="width: 56px; height: 56px; border: 0; border-radius: 28px; background: #C8F031; display: flex; align-items: center; justify-content: center; padding: 0; box-shadow: 0 10px 24px rgba(160,200,20,0.35)">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0D0E12" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { answer: 'yes' };
  }
  renderVals() {
    const answers = [['yes', 'Dabei', '✓'], ['maybe', 'Vielleicht', '?'], ['no', 'Kann nicht', '×']].map(([k, label, sign]) => {
      const sel = this.state.answer === k;
      return {
        label, sign, sel,
        color: sel ? '#0D0E12' : '#4A4E58',
        circle: 'width: 60px; height: 60px; border-radius: 30px; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; ' +
          (sel ? 'background: #0D0E12; color: #FFFFFF; box-shadow: 0 10px 24px rgba(13,14,18,0.25)' : 'background: #FFFFFF; color: #0D0E12; box-shadow: 0 6px 18px rgba(13,14,18,0.08)'),
        pick: () => this.setState({ answer: k }),
      };
    });
    return {
      answers,
      chips: [
        { label: 'Gäste', value: '4/6' },
        { label: 'Mitbringen', value: '1/2' },
        { label: 'Chat', value: '2' },
      ],
    };
  }
}
</script>
</body>
</html>
