<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Gemeinsam v5 – Konzept</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F4F5EF;text-decoration:none}
a:hover{color:#FFFFFF}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #141512; font-family: Inter, system-ui, sans-serif; color: #F4F5EF; position: relative; overflow: hidden">
  <div aria-hidden="true" style="position: absolute; top: 140px; left: -140px; width: 480px; height: 420px; border-radius: 50%; background: radial-gradient(closest-side, rgba(200,240,49,0.18) 0%, rgba(20,21,18,0) 100%)"></div>

  <div style="position: relative; height: 844px; overflow-y: auto; box-sizing: border-box; padding: 20px 24px 120px; display: flex; flex-direction: column; gap: 22px">

    <div style="display: flex; align-items: center; justify-content: space-between">
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 30px; letter-spacing: -0.5px">Gemeinsam</span>
      <span style="font-size: 12px; font-weight: 600; color: #141512; background: #B9A7EE; padding: 4px 9px; border-radius: 999px">Demo</span>
    </div>

    <div role="tablist" aria-label="Bereich" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; border: 1px solid rgba(255,255,255,0.10); background: rgba(255,255,255,0.05); border-radius: 18px; padding: 5px">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
        <button type="button" role="tab" aria-selected="{{t.sel}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
      </sc-for>
    </div>

    <section aria-label="Wartet auf dich" style="border-radius: 28px; background: #C8F031; color: #141512; padding: 20px; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 0 40px rgba(200,240,49,0.28)">
      <span style="font-size: 13px; font-weight: 600">Wartet auf deine Antwort</span>
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 26px; line-height: 30px">Geburtstagsfeier von Tom</span>
      <span style="font-size: 14px">Mo, 16. Nov · 19:30 · 3 dabei</span>
      <sc-if value="{{open}}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; gap: 8px; margin-top: 10px">
          <button type="button" onClick="{{accept}}" style="flex: 1; height: 48px; border: 0; border-radius: 16px; background: #141512; color: #C8F031; font-weight: 600; font-size: 15px">Dabei</button>
          <button type="button" onClick="{{other}}" style="flex: 1; height: 48px; border: 0; border-radius: 16px; background: rgba(20,21,18,0.12); color: #141512; font-weight: 600; font-size: 15px">Andere Antwort</button>
        </div>
      </sc-if>
      <sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
        <span style="font-size: 15px; font-weight: 600; margin-top: 6px">{{doneText}}</span>
      </sc-if>
    </section>

    <section aria-label="Diese Woche" style="display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 14px; color: #A9AD9F">Diese Woche</span>
      <sc-for list="{{events}}" as="e" hint-placeholder-count="4">
        <a href="TerminV5.dc.html" style="border: 1px solid rgba(255,255,255,0.10); border-radius: 22px; background: rgba(255,255,255,0.05); padding: 12px; display: flex; align-items: center; gap: 12px">
          <span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 14px; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">{{e.initial}}</span>
          <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
            <span style="font-weight: 600; font-size: 15px">{{e.title}}</span>
            <span style="font-size: 13px; color: #A9AD9F">{{e.when}}</span>
          </span>
          <span style="font-size: 12px; font-weight: 600; color: #C8F031">{{e.state}}</span>
        </a>
      </sc-for>
    </section>
  </div>

  <nav aria-label="Hauptnavigation" style="position: absolute; left: 24px; right: 24px; bottom: 24px; height: 64px; border-radius: 22px; border: 1px solid rgba(255,255,255,0.10); background: rgba(34,35,31,0.92); display: flex; align-items: center; justify-content: space-around">
    <a href="HeuteV5.dc.html" aria-label="Heute" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A9AD9F" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"></path></svg></a>
    <a href="KalenderV5.dc.html" aria-label="Kalender" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A9AD9F" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg></a>
    <button type="button" aria-label="Neues Event" style="width: 48px; height: 48px; border: 0; border-radius: 16px; background: rgba(255,255,255,0.10); display: flex; align-items: center; justify-content: center; padding: 0">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F4F5EF" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></button>
    <a href="GemeinsamV5.dc.html" aria-current="page" aria-label="Gemeinsam" style="width: 48px; height: 48px; border-radius: 16px; background: rgba(200,240,49,0.16); display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C8F031" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="4"></circle><path d="M2 21c0-4 3-6 7-6s7 2 7 6M16 4a4 4 0 0 1 0 8M22 21c0-3-2-5-4-6"></path></svg></a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'events', answer: null };
  }
  renderVals() {
    const tabs = [['events', 'Events'], ['groups', 'Gruppen'], ['family', 'Familie']].map(([k, label]) => {
      const sel = this.state.tab === k;
      return {
        label, sel,
        style: 'height: 44px; border: 0; border-radius: 14px; font-size: 14px; font-weight: 600; ' +
          (sel ? 'background: #F4F5EF; color: #141512' : 'background: transparent; color: #A9AD9F'),
        pick: () => this.setState({ tab: k }),
      };
    });
    return {
      tabs,
      open: this.state.answer === null,
      done: this.state.answer !== null,
      doneText: this.state.answer === 'yes' ? 'Du bist dabei (Demo).' : 'Antwort im Event wählen.',
      accept: () => this.setState({ answer: 'yes' }),
      other: () => this.setState({ answer: 'other' }),
      events: [
        { initial: 'A', title: 'Mittagessen mit Alex', when: 'Fr · 12:30', state: 'Dabei' },
        { initial: 'O', title: 'Spieleabend bei Olivia', when: 'Fr · 19:00', state: 'Dabei' },
        { initial: 'D', title: 'Lauftreff', when: 'Sa · 09:00', state: 'Gastgeber:in' },
        { initial: 'S', title: 'Grillabend am See', when: 'Mi · 16:00', state: 'Vielleicht' },
      ],
    };
  }
}
</script>
</body>
</html>
