<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Personalisieren – Konzept</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0D0E12;text-decoration:none}
a:hover{color:#2A2E38}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F3EA; font-family: Inter, system-ui, sans-serif; color: #0D0E12; position: relative; overflow: hidden">
  <div style="height: 844px; overflow-y: auto; box-sizing: border-box; padding: 18px 20px 120px; display: flex; flex-direction: column; gap: 18px">

    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 30px; letter-spacing: -0.5px">Dein Nowish</span>
      <span style="font-size: 14px; color: #5B5F69">Richte die App so ein, wie du planst.</span>
    </div>

    <div style="background: #FFFFFF; border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <span style="font-weight: 600; font-size: 16px">Akzentfarbe</span>
      <div role="radiogroup" aria-label="Akzentfarbe" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px">
        <sc-for list="{{swatches}}" as="sw" hint-placeholder-count="4">
          <button type="button" role="radio" aria-checked="{{sw.checked}}" onClick="{{sw.pick}}" style="border: 0; background: transparent; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 6px">
            <span aria-hidden="true" style="{{sw.ring}}"><span style="{{sw.fill}}"></span></span>
            <span style="font-size: 12px; font-weight: 600">{{sw.name}}</span>
          </button>
        </sc-for>
      </div>
      <div aria-hidden="true" style="background: {{accent}}; border-radius: 18px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center">
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 26px">10:38 los</span>
        <span style="font-size: 12px; font-weight: 600">Vorschau</span>
      </div>
      <span style="font-size: 12px; color: #5B5F69">Alle Farben sind auf gute Lesbarkeit geprüft (Kontrast WCAG AA).</span>
    </div>

    <div style="background: #FFFFFF; border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <span style="font-weight: 600; font-size: 16px">Darstellung</span>
      <div role="radiogroup" aria-label="Dichte" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; background: #EFE9DC; border-radius: 24px; padding: 4px">
        <sc-for list="{{densities}}" as="dn" hint-placeholder-count="2">
          <button type="button" role="radio" aria-checked="{{dn.checked}}" onClick="{{dn.pick}}" style="{{dn.style}}">{{dn.label}}</button>
        </sc-for>
      </div>
      <span style="font-size: 13px; color: #5B5F69">{{densityHint}}</span>
    </div>

    <div style="background: #FFFFFF; border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 6px">
      <span style="font-weight: 600; font-size: 16px">„Heute“ anordnen</span>
      <span style="font-size: 13px; color: #5B5F69; padding-bottom: 6px">Reihenfolge per Pfeil ändern, Bausteine ein- oder ausblenden.</span>
      <sc-for list="{{blocks}}" as="b" hint-placeholder-count="5">
        <div style="display: flex; align-items: center; gap: 8px; min-height: 56px; {{b.rowStyle}}">
          <span style="flex: 1; font-size: 15px; {{b.labelStyle}}">{{b.label}}</span>
          <button type="button" onClick="{{b.up}}" aria-label="{{b.upLabel}}" style="{{b.arrowUp}}">
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0D0E12" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"></path></svg></button>
          <button type="button" onClick="{{b.down}}" aria-label="{{b.downLabel}}" style="{{b.arrowDown}}">
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0D0E12" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg></button>
          <button type="button" role="switch" aria-checked="{{b.onText}}" aria-label="{{b.switchLabel}}" onClick="{{b.toggle}}" style="{{b.track}}"><span style="{{b.knob}}"></span></button>
        </div>
      </sc-for>
    </div>

    <div style="background: #FFFFFF; border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
      <span style="font-weight: 600; font-size: 16px">Start-Ansicht</span>
      <div role="radiogroup" aria-label="Start-Ansicht" style="display: flex; gap: 8px; flex-wrap: wrap">
        <sc-for list="{{starts}}" as="st" hint-placeholder-count="3">
          <button type="button" role="radio" aria-checked="{{st.checked}}" onClick="{{st.pick}}" style="{{st.style}}">{{st.label}}</button>
        </sc-for>
      </div>
    </div>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 22px; display: flex; gap: 10px; align-items: center">
    <nav aria-label="Hauptnavigation" style="flex: 1; height: 64px; border-radius: 32px; background: #0D0E12; display: flex; align-items: center; justify-content: space-between; padding: 0 8px">
      <a href="Main.dc.html" aria-label="Heute" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #A3A9B7">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></a>
      <a href="Kalender.dc.html" aria-label="Kalender" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #A3A9B7">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg></a>
      <a href="Termin.dc.html" aria-label="Gemeinsam" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #A3A9B7">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"></path><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c1.8.7 3 2.5 3.5 5.2"></path></svg></a>
      <a href="Personalisieren.dc.html" aria-current="page" style="height: 48px; padding: 0 16px; border-radius: 24px; background: {{accent}}; color: #0D0E12; display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 14px">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1-4 4.2-6 8-6s7 2 8 6"></path></svg>Ich</a>
    </nav>
    <button type="button" aria-label="Neuer Termin" style="width: 64px; height: 64px; border: 0; border-radius: 32px; background: {{accent}}; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0D0E12" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      accent: 'Lime',
      density: 'airy',
      start: 'today',
      blocks: [
        { id: 'leave', label: 'Nächster Aufbruch', on: true },
        { id: 'helper', label: 'Helfer-Hinweise', on: true },
        { id: 'week', label: 'Wochenleiste', on: true },
        { id: 'day', label: 'Dein Tag (Zeitleiste)', on: true },
        { id: 'family', label: 'Familie heute', on: false },
      ],
    };
  }
  move(i, d) {
    const b = this.state.blocks.slice();
    const j = i + d;
    if (j < 0 || j >= b.length) return;
    const t = b[i]; b[i] = b[j]; b[j] = t;
    this.setState({ blocks: b });
  }
  renderVals() {
    const palettes = [['Lime', '#C8F031'], ['Ozean', '#8EDBEA'], ['Koralle', '#FFB59E'], ['Lavendel', '#C9B8FF']];
    const accent = (palettes.find(([n]) => n === this.state.accent) ?? palettes[0])[1];
    const swatches = palettes.map(([name, c]) => {
      const sel = this.state.accent === name;
      return {
        name,
        checked: sel ? 'true' : 'false',
        pick: () => this.setState({ accent: name }),
        ring: 'width: 52px; height: 52px; border-radius: 26px; display: flex; align-items: center; justify-content: center; border: 2.5px solid ' + (sel ? '#0D0E12' : 'transparent'),
        fill: 'width: 40px; height: 40px; border-radius: 20px; background: ' + c,
      };
    });
    const densities = [['airy', 'Luftig'], ['compact', 'Kompakt']].map(([id, label]) => {
      const sel = this.state.density === id;
      return {
        label,
        checked: sel ? 'true' : 'false',
        pick: () => this.setState({ density: id }),
        style: 'height: 44px; border: 0; border-radius: 22px; font-weight: 600; font-size: 14px; background: ' + (sel ? '#0D0E12' : 'transparent') + '; color: ' + (sel ? '#F7F3EA' : '#0D0E12'),
      };
    });
    const n = this.state.blocks.length;
    const arrow = (enabled) => 'width: 40px; height: 40px; border: 0; border-radius: 20px; display: flex; align-items: center; justify-content: center; padding: 0; background: #EFE9DC; opacity: ' + (enabled ? '1' : '0.3');
    const blocks = this.state.blocks.map((b, i) => ({
      label: b.label,
      onText: b.on ? 'true' : 'false',
      switchLabel: b.label + ' anzeigen',
      upLabel: b.label + ' nach oben',
      downLabel: b.label + ' nach unten',
      up: () => this.move(i, -1),
      down: () => this.move(i, 1),
      arrowUp: arrow(i > 0),
      arrowDown: arrow(i < n - 1),
      toggle: () => this.setState({ blocks: this.state.blocks.map((x) => (x.id === b.id ? { ...x, on: !x.on } : x)) }),
      rowStyle: i < n - 1 ? 'border-bottom: 1px solid #EFE9DC' : '',
      labelStyle: b.on ? '' : 'color: #5B5F69',
      track: 'width: 52px; height: 32px; flex-shrink: 0; border: 0; border-radius: 16px; padding: 3px; display: flex; justify-content: ' + (b.on ? 'flex-end' : 'flex-start') + '; background: ' + (b.on ? '#0D0E12' : '#DDD5C4'),
      knob: 'width: 26px; height: 26px; border-radius: 13px; background: ' + (b.on ? accent : '#FFFFFF'),
    }));
    const starts = [['today', 'Heute'], ['calendar', 'Kalender'], ['together', 'Gemeinsam']].map(([id, label]) => {
      const sel = this.state.start === id;
      return {
        label,
        checked: sel ? 'true' : 'false',
        pick: () => this.setState({ start: id }),
        style: 'height: 44px; padding: 0 18px; border-radius: 22px; font-weight: 600; font-size: 14px; border: 1.5px solid #0D0E12; background: ' + (sel ? '#0D0E12' : 'transparent') + '; color: ' + (sel ? '#F7F3EA' : '#0D0E12'),
      };
    });
    return {
      accent,
      swatches,
      densities,
      densityHint: this.state.density === 'airy' ? 'Mehr Abstand, größere Karten – ruhiger zu lesen.' : 'Mehr Termine auf einen Blick, gleiche Schriftgröße.',
      blocks,
      starts,
    };
  }
}
</script>
</body>
</html>
