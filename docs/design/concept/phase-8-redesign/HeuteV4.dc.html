        <button type="button" style="flex: 1; height: 48px; border: 0; border-radius: 24px; background: #FFFFFF; font-size: 14px; font-weight: 600; box-shadow: 0 6px 18px rgba(13,14,18,0.06)">Ich verspäte mich</button>

        <span style="flex: 1; font-size: 15px">Spieleabend → Physio wird knapp</span>
        <span style="font-size: 14px; font-weight: 600">Lösen</span>

  <nav aria-label="Hauptnavigation" style="position: absolute; left: 50%; transform: translateX(-50%); bottom: 24px; height: 64px; border-radius: 32px; background: #FFFFFF; box-shadow: 0 12px 32px rgba(75,47,214,0.14); display: flex; align-items: center; gap: 6px; padding: 0 10px">

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { more: false, going: false };
  }
  renderVals() {
    return {
      moreOpen: this.state.more,
      toggleMore: () => this.setState({ more: !this.state.more }),
      goLabel: this.state.going ? 'Unterwegs' : 'Bin unterwegs',
      go: () => this.setState({ going: !this.state.going }),
    };
  }
}
</script>
