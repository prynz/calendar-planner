<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Gemeinsam v4 – Konzept</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0D0E12;text-decoration:none}
a:hover{color:#2A2E38}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF8F4; font-family: Inter, system-ui, sans-serif; color: #0D0E12; position: relative; overflow: hidden">
  <div aria-hidden="true" style="position: absolute; top: -160px; right: -160px; width: 520px; height: 480px; border-radius: 50%; background: radial-gradient(closest-side, #E4DAFB 0%, rgba(251,248,244,0) 100%)"></div>

  <div style="position: relative; height: 844px; overflow-y: auto; box-sizing: border-box; padding: 20px 0 130px; display: flex; flex-direction: column; gap: 24px">

    <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 24px">
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 28px; letter-spacing: -0.5px">Gemeinsam</span>
      <span style="font-size: 12px; font-weight: 600; color: #4B2FD6; background: rgba(255,255,255,0.75); padding: 4px 9px; border-radius: 999px">Demo</span>
    </div>

    <a href="FamilieV4.dc.html" style="margin: 0 24px; border-radius: 24px; background: rgba(255,255,255,0.85); padding: 14px 18px; display: flex; align-items: center; gap: 12px; box-shadow: 0 8px 24px rgba(13,14,18,0.05)">
      <span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 5px; background: #7C5CFF"></span>
      <span style="flex: 1; font-size: 15px; font-weight: 600">Familie: 1 Fahrt sucht noch jemanden</span>
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0D0E12" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg></a>

    <div role="tablist" aria-label="Bereich" style="display: flex; gap: 8px; padding: 0 24px">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
        <button type="button" role="tab" aria-selected="{{t.sel}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
      </sc-for>
    </div>

    <section aria-label="Wartet auf dich" style="display: flex; flex-direction: column; gap: 12px">
      <span style="font-weight: 600; font-size: 17px; padding: 0 24px">Wartet auf dich</span>
      <div style="display: flex; gap: 14px; overflow-x: auto; padding: 4px 24px 20px; scroll-snap-type: x mandatory">
        <sc-for list="{{cards}}" as="c" hint-placeholder-count="3">
          <a href="TerminV4.dc.html" style="{{c.style}}">
            <span style="display: flex; justify-content: space-between; align-items: center">
              <span style="font-size: 12px; font-weight: 600; background: rgba(255,255,255,0.7); padding: 4px 10px; border-radius: 999px">{{c.tag}}</span>
              <span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 16px; background: rgba(255,255,255,0.8); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px">{{c.who}}</span>
            </span>
            <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 26px; line-height: 30px">{{c.title}}</span>
            <span style="flex: 1"></span>
            <span style="font-size: 14px; font-weight: 600">{{c.when}}</span>
            <span style="font-size: 13px; color: #3A3550">{{c.sub}}</span>
          </a>
        </sc-for>
      </div>
    </section>

    <section aria-label="Deine Woche auf einen Blick" style="display: flex; flex-direction: column; gap: 12px; padding: 0 24px">
      <span style="font-weight: 600; font-size: 17px">Deine Woche auf einen Blick</span>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
        <div style="border-radius: 28px; padding: 18px; background: #FFFFFF; box-shadow: 0 8px 24px rgba(13,14,18,0.05); display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 13px; color: #4A4E58">Zugesagt</span>
          <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 36px">4</span>
          <span style="font-size: 13px; color: #4A4E58">Events</span>
        </div>
        <div style="border-radius: 28px; padding: 18px; background: linear-gradient(150deg, #FFE3CF, #E4DAFB); display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 13px; color: #3A3550">Fahrten offen</span>
          <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 36px">3</span>
          <span style="font-size: 13px; color: #3A3550">Familie</span>
        </div>
      </div>
    </section>
  </div>

  <nav aria-label="Hauptnavigation" style="position: absolute; left: 0; right: 0; bottom: 0; height: 92px">
    <svg aria-hidden="true" width="390" height="92" viewBox="0 0 390 92" style="position: absolute; left: 0; top: 0; filter: drop-shadow(0 -6px 18px rgba(75,47,214,0.10))">
      <path d="M0 24 Q0 0 24 0 H139 C154 0 157 4 161 12 A38 38 0 0 0 229 12 C233 4 236 0 251 0 H366 Q390 0 390 24 V92 H0 Z" fill="#FFFFFF"></path>
    </svg>
    <div style="position: absolute; left: 0; right: 0; top: 10px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: start">
      <a href="HeuteV4.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 48px; color: #6B6F7A">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B6F7A" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"></path></svg>
        <span style="font-size: 11px; font-weight: 500">Heute</span></a>
      <a href="KalenderV4.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 48px; color: #6B6F7A">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B6F7A" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
        <span style="font-size: 11px; font-weight: 500">Kalender</span></a>
      <span></span>
      <a href="GemeinsamV4.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 48px; color: #0D0E12">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0D0E12" stroke-width="2.2" stroke-linecap="round"><circle cx="9" cy="8" r="4"></circle><path d="M2 21c0-4 3-6 7-6s7 2 7 6M16 4a4 4 0 0 1 0 8M22 21c0-3-2-5-4-6"></path></svg>
        <span style="font-size: 11px; font-weight: 700">Gemeinsam</span></a>
      <a href="IchV4.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 48px; color: #6B6F7A">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B6F7A" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 4-6 8-6s8 2 8 6"></path></svg>
        <span style="font-size: 11px; font-weight: 500">Ich</span></a>
    </div>
    <button type="button" aria-label="Neuer Termin" style="position: absolute; left: 50%; top: -34px; transform: translateX(-50%); width: 62px; height: 62px; border: 0; border-radius: 31px; background: linear-gradient(145deg, #9B7DFF, #6A4CF0); display: flex; align-items: center; justify-content: center; padding: 0; box-shadow: 0 12px 26px rgba(106,76,240,0.40)">
      <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'events' };
  }
  renderVals() {
    const tabs = [['events', 'Events'], ['groups', 'Gruppen'], ['family', 'Familie']].map(([k, label]) => {
      const sel = this.state.tab === k;
      return {
        label, sel,
        style: 'height: 44px; border: 0; border-radius: 22px; padding: 0 18px; font-size: 15px; font-weight: 600; ' +
          (sel ? 'background: #0D0E12; color: #FFFFFF' : 'background: rgba(255,255,255,0.8); color: #0D0E12; box-shadow: 0 6px 18px rgba(13,14,18,0.05)'),
        pick: () => this.setState({ tab: k }),
      };
    });
    const card = (bg) => 'flex-shrink: 0; scroll-snap-align: start; width: 240px; height: 280px; box-sizing: border-box; border-radius: 32px; padding: 20px; display: flex; flex-direction: column; gap: 10px; background: ' + bg + '; box-shadow: 0 16px 36px rgba(120,60,90,0.12)';
    return {
      tabs,
      cards: [
        { tag: 'Antwort offen', who: 'T', title: 'Geburtstagsfeier von Tom', when: 'Mo, 16. Nov · 19:30', sub: '3 dabei · 2 offen', style: card('linear-gradient(160deg, #FFC9A6 0%, #F6C9DA 100%)') },
        { tag: 'Heute', who: 'O', title: 'Spieleabend bei Olivia', when: 'Fr · 19:00', sub: 'Du bist dabei', style: card('linear-gradient(160deg, #E4DAFB 0%, #CDE7F6 100%)') },
        { tag: 'Fahrt offen', who: 'L', title: 'Schwimmkurs Lena abholen', when: 'Sa · 16:00', sub: 'Wer fährt?', style: card('linear-gradient(160deg, #DDF2C6 0%, #FFF1C9 100%)') },
      ],
    };
  }
}
</script>
</body>
</html>
