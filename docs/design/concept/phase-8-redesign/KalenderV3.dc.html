<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Kalender v3 – Konzept</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0D0E12;text-decoration:none}
a:hover{color:#2A2E38}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF9F4; font-family: Inter, system-ui, sans-serif; color: #0D0E12; position: relative; overflow: hidden">
  <div style="height: 844px; overflow-y: auto; box-sizing: border-box; padding: 24px 24px 120px; display: flex; flex-direction: column; gap: 24px">

    <div style="display: flex; align-items: center; justify-content: space-between">
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 30px; letter-spacing: -0.5px">November</span>
      <div style="display: flex; align-items: center; gap: 4px">
        <button type="button" aria-label="Voriger Monat" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; padding: 0">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0D0E12" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></button>
        <button type="button" aria-label="Nächster Monat" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; padding: 0">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0D0E12" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg></button>
      </div>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between">
      <div role="tablist" aria-label="Ansicht" style="display: flex; gap: 20px">
        <sc-for list="{{views}}" as="v" hint-placeholder-count="3">
          <button type="button" role="tab" aria-selected="{{v.sel}}" onClick="{{v.pick}}" style="{{v.style}}">{{v.label}}</button>
        </sc-for>
      </div>
      <button type="button" aria-label="Wessen Termine: alle" style="height: 36px; border: 1px solid #DDD5C4; background: transparent; border-radius: 18px; padding: 0 12px; font-size: 14px; display: flex; align-items: center; gap: 6px">
        Alle
        <svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#0D0E12" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg></button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px">
      <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); text-align: center; font-size: 12px; font-weight: 600; color: #5B5F69; padding-bottom: 6px">
        <span>Mo</span><span>Di</span><span>Mi</span><span>Do</span><span>Fr</span><span>Sa</span><span>So</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: 2px">
        <sc-for list="{{cells}}" as="c" hint-placeholder-count="35">
          <button type="button" onClick="{{c.pick}}" aria-label="{{c.label}}" aria-pressed="{{c.sel}}" style="height: 46px; border: 0; background: transparent; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px">
            <span style="{{c.num}}">{{c.n}}</span>
            <span aria-hidden="true" style="{{c.dot}}"></span>
          </button>
        </sc-for>
      </div>
    </div>

    <section aria-label="{{dayTitle}}" style="display: flex; flex-direction: column">
      <span style="font-weight: 600; font-size: 17px; padding-bottom: 6px">{{dayTitle}}</span>
      <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
        <span style="font-size: 15px; color: #5B5F69; padding: 12px 0">Frei – nichts geplant.</span>
      </sc-if>
      <sc-for list="{{items}}" as="r" hint-placeholder-count="5">
        <a href="TerminV3.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 56px; border-bottom: 1px solid #EFE9DC">
          <span style="width: 48px; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums">{{r.time}}</span>
          <span aria-hidden="true" style="{{r.dot}}"></span>
          <span style="flex: 1; font-size: 16px">{{r.title}}</span>
          <span style="font-size: 13px; color: #5B5F69">{{r.who}}</span>
        </a>
      </sc-for>
    </section>
  </div>

  <nav aria-label="Hauptnavigation" style="position: absolute; left: 20px; right: 20px; bottom: 24px; display: flex; gap: 10px; align-items: center">
    <div style="flex: 1; height: 60px; border-radius: 30px; background: #FFFFFF; box-shadow: 0 8px 28px rgba(13,14,18,0.10); display: flex; align-items: center; justify-content: space-around; padding: 0 8px">
      <a href="HeuteV3.dc.html" aria-label="Heute" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5B5F69" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"></path></svg></a>
      <a href="KalenderV3.dc.html" aria-current="page" style="display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 14px; border-radius: 22px; background: #0D0E12; color: #FFFFFF; font-size: 14px; font-weight: 600">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Kalender</a>
      <a href="GemeinsamV3.dc.html" aria-label="Gemeinsam" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5B5F69" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="4"></circle><path d="M2 21c0-4 3-6 7-6s7 2 7 6M16 4a4 4 0 0 1 0 8M22 21c0-3-2-5-4-6"></path></svg></a>
      <a href="HeuteV3.dc.html" aria-label="Ich" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5B5F69" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 4-6 8-6s8 2 8 6"></path></svg></a>
    </div>
    <button type="button" aria-label="Neuer Termin" style="width: 60px; height: 60px; border: 0; border-radius: 30px; background: #0D0E12; display: flex; align-items: center; justify-content: center; padding: 0; box-shadow: 0 8px 28px rgba(13,14,18,0.18)">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { day: 13, view: 'month' };
  }
  renderVals() {
    const busy = { 2: 1, 5: 2, 9: 1, 13: 6, 14: 2, 15: 2, 16: 1, 18: 4, 20: 1, 23: 2, 27: 1 };
    const cells = [];
    for (let i = 0; i < 35; i++) {
      const n = i - 5; // 1 Nov 2026 is a Sunday
      if (n < 1 || n > 30) { cells.push({ n: '', label: 'leer', sel: false, num: 'font-size: 15px', dot: 'width: 4px; height: 4px', pick: () => {} }); continue; }
      const sel = n === this.state.day;
      const today = n === 13;
      cells.push({
        n: String(n),
        sel,
        label: n + '. November' + (busy[n] ? ', ' + busy[n] + ' Termine' : ', frei'),
        num: 'width: 32px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 15px; ' +
          (sel ? 'background: #0D0E12; color: #FFFFFF; font-weight: 600' : today ? 'font-weight: 700; text-decoration: underline' : ''),
        dot: 'width: 4px; height: 4px; border-radius: 2px; background: ' + (busy[n] ? '#A3A9B7' : 'transparent'),
        pick: () => this.setState({ day: n }),
      });
    }
    const all = {
      13: [
        ['08:30', 'Zahnarzt', 'Du', '#7FD3E6'], ['12:30', 'Mittagessen mit Alex', 'Du', '#B9A7EE'], ['16:00', 'Grillen', 'Familie', '#B9A7EE'],
        ['17:45', 'Friseur', 'Du', '#7FD3E6'], ['19:00', 'Spieleabend bei Olivia', 'Du', '#B9A7EE'],
      ],
      14: [['09:00', 'Lauftreff', 'Du', '#FFC49B'], ['15:00', 'Schwimmkurs', 'Lena', '#FFC49B']],
    };
    const list = all[this.state.day] || [];
    const views = [['week', 'Woche'], ['month', 'Monat'], ['list', 'Liste']].map(([k, label]) => {
      const sel = this.state.view === k;
      return {
        label, sel,
        style: 'height: 36px; border: 0; background: transparent; padding: 0; font-size: 15px; ' +
          (sel ? 'font-weight: 600; color: #0D0E12; box-shadow: inset 0 -2px 0 #0D0E12' : 'color: #5B5F69'),
        pick: () => this.setState({ view: k }),
      };
    });
    return {
      views,
      cells,
      dayTitle: (this.state.day === 13 ? 'Heute, ' : '') + this.state.day + '. November',
      empty: list.length === 0,
      items: list.map(([time, title, who, c]) => ({ time, title, who, dot: 'width: 8px; height: 8px; border-radius: 4px; background: ' + c })),
    };
  }
}
</script>
</body>
</html>
